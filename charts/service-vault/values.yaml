# Default values for ace.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Overrides name template
nameOverride: ""
# Overrides fullname template
fullnameOverride: ""

global:
  # License for the product.
  # Example:
  # helm install appscode/service-vault \
  #   --set-file global.license=/path/to/license/file
  license: ""
  # Name of Secret with the license as key.txt key
  licenseSecretName: ""
  # Docker registry used to pull the images
  registry: ""
  # Docker registry fqdn used to pull the images.
  # Set this to use docker registry hosted at ${registryFQDN}/${registry}/${image}
  registryFQDN: ghcr.io
  # Specify an array of imagePullSecrets.
  # Secrets must be manually created in the namespace.
  imagePullSecrets: []
  distro:
    openshift: false
    ubi: ""

clusterMetadata:
  uid: ""
  name: ""

infra:
  host: chart-example.local
  hostType: domain
  tenantSpreadPolicy: "multi"
  tls:
    issuer: "ca" # ca,letsencrypt,letsencrypt-staging
    ca:
      cert: ""
      key: ""
    acme:
      email: ops@appscode.com
      solver: Gateway
      gatewayName: backend
    certificate:
      cert: ""
      key: ""
    jks:
      keystore:
      truststore:
      password: ""
  dns:
    provider: "external" # external,cloudflare,route53,cloudDNS
    auth: {}
      # cloudflare:
        # token: xyz
      # cloudDNS:
        # GOOGLE_PROJECT_ID: "project-id"
        # GOOGLE_SERVICE_ACCOUNT_JSON_KEY: xyz
      # azureDNS:
        # subscriptionID: "azure-subscription-id"
        # tenantID: "azure-tenant-id"
        # resourceGroupName: "resource-group-name"
        # hostedZoneName: "zone-name-for-hosted-domain"
        # servicePrincipalAppID: "service-principal-id"
        # servicePrincipalAppPassword: "service-principal-app"
        # environment: AzurePublicCloud
      # route53:
        # AWS_ACCESS_KEY_ID: "access-id"
        # AWS_SECRET_ACCESS_KEY: "secret-key"
        # AWS_REGION: "us-east-1"

# https://github.com/kubernetes-sigs/external-dns/blob/master/docs/sources/service.md
gateway-dns:
  enabled: false

vaultServer:
  # Vault server name that exist on cluster
  name: "vault"
  version: sigilr-2.6.1.1
  replicas: 3
  # propagated to the spoke's AppBinding; set false for the root case
  isolateTenants: true
  # ClusterIP | LoadBalancer | NodePort
  # LoadBalancer and NodePort emit spec.serviceTemplates on the VaultServer
  serviceType: ClusterIP
  terminationPolicy: WipeOut
  persistence:
    storageClassName: ""
    size: 1Gi
  unsealer:
    secretShares: 5
    secretThreshold: 3
  tls:
    # cert-manager CA secret backing the vault issuer; empty means a selfSigned issuer
    caSecretName: vault-ca
  relay:
    clusterSet: cp-dbaas-generic
    namespace: vault-relay-demo
    bootstrapTokenTTL: 24h

distro:
  openshift: false
  ubi: ""
