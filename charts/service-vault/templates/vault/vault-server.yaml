# backups
# tls encrypt
# monitoring

apiVersion: kubevault.com/v1alpha2
kind: VaultServer
metadata:
  name: {{ .Values.vaultServer.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-vault.labels" . | nindent 4 }}
  {{- with .Values.vaultServer.serverAddress }}
  annotations:
    kubevault.com/server-address: {{ . | quote }}
  {{- end }}
spec:
  allowedSecretEngines:
    namespaces:
      from: All
  isolateTenants: {{ .Values.vaultServer.isolateTenants }}
  version: {{ .Values.vaultServer.version | quote }}
  replicas: {{ .Values.vaultServer.replicas }}
  tls:
    issuerRef:
      name: {{ include "service-vault.fullname" . }}-ca-issuer
      kind: Issuer
      apiGroup: cert-manager.io
    {{- with .Values.vaultServer.serverAddress }}
    # the operator only adds LoadBalancer ingress to the server cert SANs, not this address
    certificates:
      - alias: server
        {{- if regexMatch "^[0-9.]+$|:" . }}
        ipAddresses:
        {{- else }}
        dnsNames:
        {{- end }}
          - {{ . | quote }}
    {{- end }}
  backend:
    raft:
      storage:
        {{- with .Values.vaultServer.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.vaultServer.persistence.size }}
  unsealer:
    secretShares: {{ .Values.vaultServer.unsealer.secretShares }}
    secretThreshold: {{ .Values.vaultServer.unsealer.secretThreshold }}
    mode:
      kubernetesSecret:
        secretName: {{ .Values.vaultServer.name }}-keys
  {{- if ne (toString .Values.vaultServer.serviceType) "ClusterIP" }}
  serviceTemplates:
    - alias: vault
      spec:
        type: {{ .Values.vaultServer.serviceType }}
  {{- end }}
  {{- with .Values.vaultServer.relay.clusterSet }}
  {{- if and (eq (toString $.Values.vaultServer.serviceType) "ClusterIP") (not $.Values.vaultServer.serverAddress) }}
  {{- fail "vaultServer.relay.clusterSet requires vaultServer.serviceType=LoadBalancer or vaultServer.serverAddress set to an externally-resolvable address" }}
  {{- end }}
  relayPlacementRef:
    name: {{ . }}
  relayTemplate:
    namespace: {{ $.Values.vaultServer.relay.namespace }}
    bootstrapTokenTTL: {{ $.Values.vaultServer.relay.bootstrapTokenTTL }}
  {{- end }}
  monitor:
    agent: prometheus.io
    prometheus:
      exporter:
        resources: {}
  terminationPolicy: {{ .Values.vaultServer.terminationPolicy }}
