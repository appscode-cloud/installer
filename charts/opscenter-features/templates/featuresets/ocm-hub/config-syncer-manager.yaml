{{ $defaults := printf `
registryFQDN: %s
image: %s
placement:
  create: false
`
  (include "registry.ghcr" $)
  (include "image.ghcr" (merge (dict "_repo" "appscode/config-syncer") $))
  | fromYaml }}

{{ $vals := dig "config-syncer-manager" "values" (dict) .Values.helm.releases }}
{{ $vals = mergeOverwrite $defaults $vals }}

{{- if eq (include "distro.openshift" $) "true" }}
{{ $vals = mergeOverwrite $vals (dict "distro" .Values.distro) }}
{{- end }}

apiVersion: ui.k8s.appscode.com/v1alpha1
kind: Feature
metadata:
  name: config-syncer-manager
  labels:
    app.kubernetes.io/part-of: ocm-hub
spec:
  title: Config Syncer Manager
  description: |
    Deploy Config Syncer Manager
  icons:
    - src: https://cdn.appscode.com/k8s/icons/menu/cluster.svg
      type: image/svg+xml
  featureSet: ocm-hub
  featureBlock: cluster-manager-hub
  recommended: false
  requirements:
    features:
      - cluster-manager-hub
      - cluster-profile-manager
  readinessChecks:
    workloads:
      - group: apps
        version: v1
        kind: Deployment
        selector:
          app.kubernetes.io/instance: config-syncer-manager
          app.kubernetes.io/name: config-syncer-manager
  chart:
    name: config-syncer-manager
    namespace: open-cluster-management-addon
    createNamespace: {{ $.Values.helm.createNamespace }}
    version: {{ dig "config-syncer-manager" "version" "" $.Values.helm.releases }}
    sourceRef:
      kind: HelmRepository
      name: appscode-charts-oci
      namespace: {{ .Release.Namespace }}
{{- with $vals }}
  {{- dict "values" . | toYaml | nindent 2 }}
{{- end }}
