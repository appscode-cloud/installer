{{- /* An empty Docker Hub proxy means "pull from Docker Hub": leave the chart's registry alone then. */ -}}
{{ $defaults := dict }}
{{- with include "registry.dockerHub" $ }}
{{ $defaults = dict "image" (dict "registry" .) }}
{{- end }}

{{ $vals := dig "kube-bench" "values" (dict) .Values.helm.releases }}
{{ $vals = mergeOverwrite $defaults $vals }}

apiVersion: ui.k8s.appscode.com/v1alpha1
kind: Feature
metadata:
  name: kube-bench
  labels:
    app.kubernetes.io/part-of: opscenter-security
spec:
  title: kube-bench
  description: |
    Runs the CIS Kubernetes Benchmark on the nodes on a schedule and leaves the results in a ConfigMap for Patch Console.
  icons:
  - src: https://cdn.appscode.com/k8s/icons/menu/cluster.svg
    type: image/svg+xml
  featureSet: opscenter-security
  featureBlock: kube-bench
  recommended: false
  chart:
    name: kube-bench
    namespace: kube-bench
    createNamespace: {{ $.Values.helm.createNamespace }}
    version: {{ dig "kube-bench" "version" "" $.Values.helm.releases }}
    sourceRef:
      kind: HelmRepository
      name: appscode-charts-oci
      namespace: {{ .Release.Namespace }}
{{- with $vals }}
  {{- dict "values" . | toYaml | nindent 2 }}
{{- end }}
