{{- $vals := deepCopy .Values }}
{{- include "opscenter-features.unsetPaths" (dict "vals" $vals "paths" (include "opscenter-features.profileCredPaths" . | fromYamlArray)) }}

apiVersion: ui.k8s.appscode.com/v1alpha1
kind: Feature
metadata:
  name: opscenter-features
  labels:
    app.kubernetes.io/part-of: opscenter-core
spec:
  title: Opscenter Features
  description: |
    Opscenter Configurator.
  icons:
  - src: https://cdn.appscode.com/k8s/icons/menu/cluster.svg
    type: image/svg+xml
  featureSet: opscenter-core
  featureBlock: opscenter-features
  recommended: false
  readinessChecks:
    workloads:
    - group: source.toolkit.fluxcd.io
      version: v1
      kind: HelmRepository
      selector:
        kubernetes.io/metadata.name: appscode-charts-oci
  chart:
    name: opscenter-features
    namespace: kubeops
    createNamespace: {{ $.Values.helm.createNamespace }}
    version: {{ dig "opscenter-features" "version" "" $.Values.helm.releases }}
    sourceRef:
      kind: HelmRepository
      name: appscode-charts-oci
      namespace: {{ .Release.Namespace }}
  valuesFrom:
    - kind: Secret
      name: opscenter-features-cred
      valuesKey: opscenter-features.yaml
{{- dict "values" $vals | toYaml | nindent 2 }}
