{{- /*
  Every Secret that embeds a generated value is rendered here, so each value is drawn once per render and the
  Secrets agree. A value is generated at the first install and read back (lookup) afterwards. `helm template`
  has no cluster: it draws new ones.
*/ -}}
{{- $ns := .Release.Namespace -}}
{{- $credName := include "akp-prereqs.credentials" . -}}
{{- $existing := lookup "v1" "Secret" $ns $credName -}}
{{- $have := dict -}}
{{- if $existing -}}
{{- range $k, $v := $existing.data }}{{ $_ := set $have $k ($v | b64dec) }}{{ end -}}
{{- end -}}
{{- $c := dict -}}
{{- range $k, $len := dict "postgres-password" 32 "akp-db-password" 32 "casdoor-db-password" 32 "casdoor-admin-password" 24 "admin-password" 20 "akp-casdoor-client-secret" 40 "kms-master-key" 64 "oauth2-jwt-secret" 43 "csrf-secret-key" 64 -}}
{{- $_ := set $c $k (default (randAlphaNum (int $len)) (get $have $k)) -}}
{{- end -}}
{{- /* The key Casdoor signs tokens with. */ -}}
{{- if and (hasKey $have "casdoor-jwt-cert") (hasKey $have "casdoor-jwt-key") -}}
{{- $_ := set $c "casdoor-jwt-cert" (get $have "casdoor-jwt-cert") -}}
{{- $_ := set $c "casdoor-jwt-key" (get $have "casdoor-jwt-key") -}}
{{- else -}}
{{- $g := genSelfSignedCert "akp-casdoor" nil nil 7300 -}}
{{- $_ := set $c "casdoor-jwt-cert" $g.Cert -}}
{{- $_ := set $c "casdoor-jwt-key" $g.Key -}}
{{- end -}}
{{- $pg := .Values.postgres -}}
{{- $host := include "akp-prereqs.host" . -}}
{{- $public := include "akp-prereqs.publicUrl" . -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $credName }}
  namespace: {{ $ns }}
  labels:
    {{- include "akp-prereqs.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- range $k, $v := $c }}
  {{ $k }}: {{ $v | b64enc }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "akp-prereqs.casdoor" . }}-conf
  namespace: {{ $ns }}
  labels:
    {{- include "akp-prereqs.labels" . | nindent 4 }}
stringData:
  app.conf: |
    appname = casdoor
    httpport = 8000
    runmode = prod
    copyrequestbody = true
    driverName = postgres
    dataSourceName = user={{ $pg.databases.casdoor.user }} password={{ index $c "casdoor-db-password" }} host={{ include "akp-prereqs.postgres" . }} port=5432 sslmode=disable dbname={{ $pg.databases.casdoor.name }}
    dbName = {{ $pg.databases.casdoor.name }}
    tableNamePrefix =
    showSql = false
    redisEndpoint =
    defaultStorageProvider =
    isCloudIntranet = false
    authState = "casdoor"
    socks5Proxy = ""
    verificationCodeTimeout = 10
    initScore = 0
    logPostOnly = true
    isUsernameLowered = false
    origin = {{ include "akp-prereqs.casdoorPublicUrl" . }}
    originFrontend =
    staticBaseUrl = "https://cdn.casbin.org"
    isDemoMode = false
    batchSize = 100
    showGithubCorner = false
    forceLanguage = ""
    defaultLanguage = "en"
    defaultApplication = "{{ .Values.casdoor.application.name }}"
    maxItemsForFlatMenu = 7
    enableErrorMask = false
    enableGzip = true
    inactiveTimeoutMinutes =
    ldapServerPort = 389
    ldapsCertId = ""
    ldapsServerPort = 636
    radiusServerPort = 1812
    radiusDefaultOrganization = "built-in"
    radiusSecret = "secret"
    quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
    logConfig = {"adapter":"console"}
    initAdminPassword = {{ index $c "casdoor-admin-password" | quote }}
    initDataNewOnly = true
    initDataFile = "/conf/init_data.json"
    frontendBaseDir = "../cc_0"
  init_data.json: |
    {{- $org := .Values.casdoor.organization }}
    {
      "organizations": [
        {
          "owner": "admin",
          "name": {{ $org | quote }},
          "displayName": "AKP",
          "passwordType": "bcrypt",
          "passwordOptions": ["AtLeast6"],
          "countryCodes": ["US"],
          "languages": ["en"],
          "tags": [],
          "accountItems": [],
          "mfaItems": [{"name": "Needed", "rule": {{ .Values.casdoor.mfaRule | quote }}}],
          "initScore": 0,
          "isProfilePublic": false,
          "enableSoftDeletion": false
        }
      ],
      "certs": [
        {
          "owner": "admin",
          "name": "cert-akp",
          "displayName": "AKP signing certificate",
          "scope": "JWT",
          "type": "x509",
          "cryptoAlgorithm": "RS256",
          "bitSize": 2048,
          "expireInYears": 20,
          "certificate": {{ index $c "casdoor-jwt-cert" | toJson }},
          "privateKey": {{ index $c "casdoor-jwt-key" | toJson }}
        }
      ],
      "applications": [
        {
          "owner": "admin",
          "name": {{ .Values.casdoor.application.name | quote }},
          "displayName": "AKP",
          "category": "Default",
          "type": "All",
          "organization": {{ $org | quote }},
          "cert": "cert-akp",
          "clientId": {{ .Values.casdoor.application.clientId | quote }},
          "clientSecret": {{ index $c "akp-casdoor-client-secret" | quote }},
          "enablePassword": true,
          "enableSignUp": false,
          "providers": [],
          "signinMethods": [{"name": "Password", "displayName": "Password", "rule": "All"}],
          "signupItems": [],
          "signinItems": [],
          "grantTypes": ["authorization_code", "refresh_token"],
          "scopes": [],
          "redirectUris": [{{ printf "%s%s/casdoor/callback" $public .Values.casdoor.iamPublicPath | quote }}],
          "tags": [],
          "tokenFields": [],
          "expireInHours": 1,
          "refreshExpireInHours": 1,
          "cookieExpireInHours": 24,
          "tokenFormat": "JWT",
          "tokenSigningMethod": "RS256"
        }
      ],
      "users": [
        {
          "owner": {{ $org | quote }},
          "name": {{ .Values.casdoor.admin.username | quote }},
          "type": "normal-user",
          "password": {{ index $c "admin-password" | quote }},
          "displayName": {{ .Values.casdoor.admin.displayName | quote }},
          "email": {{ .Values.casdoor.admin.email | quote }},
          "countryCode": "US",
          "address": [],
          "tag": "staff",
          "score": 0,
          "isAdmin": true,
          "isForbidden": false,
          "isDeleted": false,
          "signupApplication": {{ .Values.casdoor.application.name | quote }},
          "properties": {}
        }
      ]
    }
{{- $tlsName := .Values.tls.secretName }}
{{- $tls := lookup "v1" "Secret" $ns $tlsName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsName }}
  namespace: {{ $ns }}
  labels:
    {{- include "akp-prereqs.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
{{- if $tls }}
  tls.crt: {{ index $tls.data "tls.crt" }}
  tls.key: {{ index $tls.data "tls.key" }}
{{- else }}
{{- $g := genSelfSignedCert $host nil (list $host (include "akp-prereqs.casdoorHost" .)) (int .Values.tls.validityDays) }}
  tls.crt: {{ $g.Cert | b64enc }}
  tls.key: {{ $g.Key | b64enc }}
{{- end }}
