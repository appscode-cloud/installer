{{- $name := printf "%s-nats-keys" .Release.Name }}
{{- $ns := .Release.Namespace }}
{{- $creds := include "akp-prereqs.natsCreds" . }}
{{- /*
  NATS runs in operator mode: b3 keeps an account per person and the admin connection it opens at start needs an
  operator, a system account and an admin account. nsc makes them once, in a hook Job that writes one Secret through
  the API (the seeds never touch the chart, the values or the logs). The Secret is not Helm's, so it stays on
  uninstall: hack/akp-v2-demo/teardown.sh removes it. hack/akp-v2-demo/ace-values.sh turns it into ace's `settings.nats`
  and the NATS server's operator-mode configuration.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "akp-prereqs.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "akp-prereqs.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [{{ $creds | quote }}]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "akp-prereqs.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  labels:
    {{- include "akp-prereqs.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "akp-prereqs.selector" (dict "root" . "component" "nats-keys") | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      {{- include "akp-prereqs.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nsc
        image: {{ include "akp-prereqs.image" (dict "root" . "image" .Values.nats.natsBox) }}
        imagePullPolicy: {{ .Values.nats.natsBox.pullPolicy }}
        workingDir: /tmp
        command: ["sh", "-c"]
        args:
        - |
          set -eu
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          API=https://kubernetes.default.svc/api/v1/namespaces/$NS/secrets
          k() { curl -sS --cacert $SA/ca.crt -H "Authorization: Bearer $(cat $SA/token)" "$@"; }
          if [ "$(k -o /dev/null -w '%{http_code}' $API/$CREDS)" = 200 ]; then echo "the NATS identities exist: nothing to do"; exit 0; fi

          rm -rf /tmp/nsc /tmp/nkeys /tmp/cfg /tmp/data /tmp/out
          export HOME=/tmp NSC_HOME=/tmp/nsc NKEYS_PATH=/tmp/nkeys XDG_CONFIG_HOME=/tmp/cfg XDG_DATA_HOME=/tmp/data
          nsc add operator --name akp --sys >/dev/null
          nsc add account --name ADMIN >/dev/null
          nsc edit account --name ADMIN --js-mem-storage -1 --js-disk-storage -1 --js-streams -1 --js-consumer -1 >/dev/null
          nsc add user --name admin --account ADMIN >/dev/null

          seed() { find /tmp/nkeys/keys/$1 -name "$2.nk" | head -n 1 | xargs cat; }
          # The .creds layout b3 reads (the JWT and the seed of the key that signs), for an operator, an account or a user.
          creds() { # kind(OPERATOR|ACCOUNT|USER) jwt seed
            printf -- '-----BEGIN NATS %s JWT-----\n%s\n------END NATS %s JWT------\n\n' "$1" "$2" "$1"
            printf -- '************************* IMPORTANT *************************\nNKEY Seed printed below can be used to sign and prove identity.\nNKEYs are sensitive and should be treated as secrets.\n\n'
            printf -- '-----BEGIN %s NKEY SEED-----\n%s\n------END %s NKEY SEED------\n\n*************************************************************\n' "$1" "$3" "$1"
          }
          OP_JWT=$(nsc describe operator --raw)
          OP_PUB=$(nsc describe operator --field sub | tr -d '"')
          SYS_JWT=$(nsc describe account SYS --raw)
          SYS_PUB=$(nsc describe account SYS --field sub | tr -d '"')
          ADMIN_JWT=$(nsc describe account ADMIN --raw)
          ADMIN_PUB=$(nsc describe account ADMIN --field sub | tr -d '"')
          USER_PUB=$(nsc describe user admin --account ADMIN --field sub | tr -d '"')
          SYSUSER_PUB=$(nsc describe user sys --account SYS --field sub | tr -d '"')
          USER_JWT=$(nsc describe user admin --account ADMIN --raw)
          SYSUSER_JWT=$(nsc describe user sys --account SYS --raw)
          mkdir -p /tmp/out
          creds OPERATOR "$OP_JWT" "$(seed O $OP_PUB)" > /tmp/out/Operator.creds
          creds ACCOUNT "$SYS_JWT" "$(seed A $SYS_PUB)" > /tmp/out/SYS.creds
          creds USER "$SYSUSER_JWT" "$(seed U $SYSUSER_PUB)" > /tmp/out/sys.creds
          creds ACCOUNT "$ADMIN_JWT" "$(seed A $ADMIN_PUB)" > /tmp/out/ADMIN.creds
          creds USER "$USER_JWT" "$(seed U $USER_PUB)" > /tmp/out/admin.creds
          printf %s "$OP_JWT" > /tmp/out/Operator.jwt
          printf %s "$SYS_JWT" > /tmp/out/SYS.jwt
          printf %s "$SYS_PUB" > /tmp/out/SYS.pub
          b64() { base64 -w0 "$1"; }
          post() { # name file...
            name=$1; shift
            data=""
            for f in "$@"; do data="$data\"$(basename $f)\":\"$(b64 $f)\","; done
            printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"%s","labels":{"app.kubernetes.io/part-of":"akp"}},"data":{%s}}' "$name" "${data%,}" |
              k -o /tmp/resp -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d @- $API
          }
          code=$(post $CREDS /tmp/out/Operator.creds /tmp/out/SYS.creds /tmp/out/sys.creds /tmp/out/ADMIN.creds /tmp/out/admin.creds /tmp/out/Operator.jwt /tmp/out/SYS.jwt /tmp/out/SYS.pub)
          [ "$code" = 201 ] || { echo "creating $CREDS: HTTP $code"; cat /tmp/resp; exit 1; }
          echo "NATS identities made"
        env:
        - { name: NS, value: {{ $ns | quote }} }
        - { name: CREDS, value: {{ $creds | quote }} }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - { name: tmp, mountPath: /tmp }
      volumes:
      - { name: tmp, emptyDir: {} }
