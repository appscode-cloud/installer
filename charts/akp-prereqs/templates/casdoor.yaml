{{- $name := include "akp-prereqs.casdoor" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "akp-prereqs.labels" . | nindent 4 }}
spec:
  ports:
  - name: http
    port: 8000
    targetPort: http
  selector:
    {{- include "akp-prereqs.selector" (dict "root" . "component" "casdoor") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "akp-prereqs.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "akp-prereqs.selector" (dict "root" . "component" "casdoor") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "akp-prereqs.selector" (dict "root" . "component" "casdoor") | nindent 8 }}
      annotations:
        # The configuration is a Secret made in secrets.yaml; restart when it changes.
        checksum/conf: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum | trunc 16 }}
    spec:
      {{- include "akp-prereqs.imagePullSecrets" . | nindent 6 }}
      initContainers:
      - name: wait-for-postgres
        image: {{ include "akp-prereqs.image" (dict "root" . "image" .Values.postgres.image) }}
        imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
        command: ["sh", "-c", "until pg_isready -h {{ include "akp-prereqs.postgres" . }} -p 5432; do sleep 2; done"]
      containers:
      - name: casdoor
        image: {{ include "akp-prereqs.image" (dict "root" . "image" .Values.casdoor.image) }}
        imagePullPolicy: {{ .Values.casdoor.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8000
        volumeMounts:
        - { name: conf, mountPath: /conf/app.conf, subPath: app.conf, readOnly: true }
        - { name: conf, mountPath: /conf/init_data.json, subPath: init_data.json, readOnly: true }
        readinessProbe:
          httpGet: { path: /api/health, port: http }
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 24
        livenessProbe:
          httpGet: { path: /api/health, port: http }
          initialDelaySeconds: 60
          periodSeconds: 10
        resources:
          {{- toYaml .Values.casdoor.resources | nindent 10 }}
      volumes:
      - name: conf
        secret:
          secretName: {{ $name }}-conf
---
# Casdoor cannot live under a path: it has its own host on the Gateway of the ace chart.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "akp-prereqs.labels" . | nindent 4 }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.gateway.name }}
    namespace: {{ .Release.Namespace }}
    sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
  - {{ include "akp-prereqs.casdoorHost" . }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: {{ $name }}
      port: 8000
