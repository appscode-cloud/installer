apiVersion: v1
kind: Service
metadata:
  name: {{ include "trust-console-ui.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trust-console-ui.labels" . | nindent 4 }}
spec:
  ports:
  - { name: http, port: {{ .Values.service.port }}, targetPort: http }
  selector:
    {{- include "trust-console-ui.selectorLabels" . | nindent 4 }}
