storageClasses:
  available: []
  default: ""
  toggle: true

tls:
  default: true
  toggle: true
clusterIssuers:
  available: []
  default: ""
  toggle: true
expose:
  enable:
    default: true
    toggle: true
serviceTemplates: []
showPreview: false
leftPanel:
  showInsights: true
  showVaultInfo: true
  showOperations: true
  showBackup: true
  showBackupLegacy: false
  showSecurity: false
nodeSelector: {}
tolerations: []

monitoring:
  # Name of monitoring agent (one of "prometheus.io", "prometheus.io/operator", "prometheus.io/builtin")
  agent: prometheus.io/operator
  exporter:
    resources: {}
  toggle: true
alert:
  toggle: true

authCredential:
  customize: true
  referExisting: true
customConfiguration: true

deletionPolicy:
  default: WipeOut
  toggle: true
backup:
  enable:
    default: true
    toggle: true
  by: BackupConfiguration
  via: Restic
archiver:
  enable:
    toggle: true
    default: false
  via: Restic
pointInTimeRecovery:
  default: false
  toggle: true

gitOps:
  enable:
    toggle: true
    default: false

machineProfiles:
  machines: []
  available: []
  default: ""
