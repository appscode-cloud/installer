{{- if (eq .Values.infra.tls.issuer "ca") }}

{{- /* ca.crt repeats the CA certificate so Gateways can validate client certificates
       (mTLS) against this Secret: Gateway frontend validation reads the ca.crt key.
       cert-manager's CA Issuer ignores it. */}}
{{- $data := dict
    "tls.crt" .Values.infra.tls.ca.cert
    "tls.key" .Values.infra.tls.ca.key
    "ca.crt" .Values.infra.tls.ca.cert
}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tenant.name" . }}-gw-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "service-gateway.labels" . | nindent 4 }}
type: kubernetes.io/tls
stringData: {{ $data | toJson }}
{{- end }}
