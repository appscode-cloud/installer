apiVersion: v1
kind: Service
metadata:
  name: {{ include "casdoor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "casdoor.labels" . | nindent 4 }}
spec:
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
  selector:
    {{- include "casdoor.selectorLabels" . | nindent 4 }}
