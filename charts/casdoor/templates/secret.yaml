{{- $fn := include "casdoor.fullname" . -}}
{{- $db := .Values.database -}}
{{- $org := .Values.organization -}}
{{- /* The JWT key is drawn once and read back afterwards: tokens already issued stay valid across upgrades. */ -}}
{{- $jwt := dict "cert" .Values.jwt.certificate "key" .Values.jwt.privateKey -}}
{{- if not (and $jwt.cert $jwt.key) -}}
{{- with lookup "v1" "Secret" .Release.Namespace (printf "%s-jwt" $fn) -}}
{{- $_ := set $jwt "cert" (index .data "tls.crt" | b64dec) -}}
{{- $_ := set $jwt "key" (index .data "tls.key" | b64dec) -}}
{{- else -}}
{{- $g := genSelfSignedCert $fn nil nil 7300 -}}
{{- $_ := set $jwt "cert" $g.Cert -}}
{{- $_ := set $jwt "key" $g.Key -}}
{{- end -}}
{{- end -}}
{{- $apps := list -}}
{{- range .Values.applications -}}
{{- $apps = append $apps (dict
  "owner" "admin" "name" .name "displayName" .displayName "category" "Default" "type" "All"
  "organization" $org.name "cert" "cert-jwt" "clientId" .clientId
  "clientSecret" (required (printf "applications[%s].clientSecret is required" .name) .clientSecret)
  "enablePassword" true "enableSignUp" false "providers" (list)
  "signinMethods" (list (dict "name" "Password" "displayName" "Password" "rule" "All"))
  "signupItems" (list) "signinItems" (list) "grantTypes" (list "authorization_code" "refresh_token") "scopes" (list)
  "redirectUris" .redirectUris "tags" (list) "tokenFields" (list)
  "expireInHours" 1 "refreshExpireInHours" 1 "cookieExpireInHours" 24 "tokenFormat" "JWT" "tokenSigningMethod" "RS256") -}}
{{- end -}}
{{- $signupApp := "" -}}
{{- with .Values.applications }}{{ $signupApp = (index . 0).name }}{{ end -}}
{{- $users := list -}}
{{- range .Values.users -}}
{{- $users = append $users (dict
  "owner" $org.name "name" .name "type" "normal-user"
  "password" (required (printf "users[%s].password is required" .name) .password)
  "displayName" .displayName "email" .email "countryCode" "US" "address" (list) "tag" (default "staff" .tag)
  "score" 0 "isAdmin" true "isForbidden" false "isDeleted" false
  "signupApplication" $signupApp
  "properties" (dict)) -}}
{{- end -}}
{{- $init := dict
  "organizations" (list (dict
    "owner" "admin" "name" $org.name "displayName" $org.displayName "passwordType" "bcrypt"
    "passwordOptions" (list "AtLeast6") "countryCodes" (list "US") "languages" (list "en") "tags" (list)
    "accountItems" (list) "mfaItems" (list (dict "name" "Needed" "rule" $org.mfaRule))
    "initScore" 0 "isProfilePublic" false "enableSoftDeletion" false))
  "certs" (list (dict
    "owner" "admin" "name" "cert-jwt" "displayName" "Token signing certificate" "scope" "JWT" "type" "x509"
    "cryptoAlgorithm" "RS256" "bitSize" 2048 "expireInYears" 20 "certificate" $jwt.cert "privateKey" $jwt.key))
  "applications" $apps
  "users" $users
-}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fn }}-jwt
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "casdoor.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  tls.crt: {{ $jwt.cert | b64enc }}
  tls.key: {{ $jwt.key | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fn }}-conf
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "casdoor.labels" . | nindent 4 }}
stringData:
  app.conf: |
    appname = casdoor
    httpport = {{ .Values.service.port }}
    runmode = prod
    copyrequestbody = true
    driverName = postgres
    dataSourceName = user={{ $db.user }} password={{ required "database.password is required" $db.password }} host={{ required "database.host is required" $db.host }} port={{ $db.port }} sslmode={{ $db.sslmode }} dbname={{ $db.name }}
    dbName = {{ $db.name }}
    tableNamePrefix =
    showSql = false
    redisEndpoint =
    defaultStorageProvider =
    isCloudIntranet = false
    authState = "casdoor"
    socks5Proxy = ""
    verificationCodeTimeout = 10
    initScore = 0
    logPostOnly = true
    isUsernameLowered = false
    origin = {{ include "casdoor.publicUrl" . }}
    originFrontend =
    staticBaseUrl = "https://cdn.casbin.org"
    isDemoMode = false
    batchSize = 100
    showGithubCorner = false
    forceLanguage = ""
    defaultLanguage = "en"
    {{- with .Values.applications }}
    defaultApplication = {{ (index . 0).name | quote }}
    {{- end }}
    maxItemsForFlatMenu = 7
    enableErrorMask = false
    enableGzip = true
    inactiveTimeoutMinutes =
    ldapServerPort = 389
    ldapsCertId = ""
    ldapsServerPort = 636
    radiusServerPort = 1812
    radiusDefaultOrganization = "built-in"
    radiusSecret = "secret"
    quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
    logConfig = {"adapter":"console"}
    initAdminPassword = {{ required "adminPassword is required" .Values.adminPassword | quote }}
    initDataNewOnly = true
    initDataFile = "/conf/init_data.json"
    frontendBaseDir = "../cc_0"
  init_data.json: |
    {{- $init | toPrettyJson | nindent 4 }}
