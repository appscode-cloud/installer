{{- with (index .Values "helm" "releases" "opscenter-features") }}
{{- if .enabled }}

{{ $defaults := dict "offlineInstaller" $.Values.offlineInstaller "image" $.Values.image "registry" $.Values.registry "helm" dict }}

{{ $helmrepos := dig "repositories" dict $.Values.helm | deepCopy }}
{{- include "ace-installer.applyRegcache" (dict "top" $ "repos" $helmrepos) }}
{{ $_ := set $defaults.helm "repositories" $helmrepos }}
{{ $_ := set $defaults.helm "createNamespace" $.Values.helm.createNamespace }}

{{ $credPaths := include "ace-installer.featureCred.profileCredPaths" $ | fromYamlArray }}
{{ $vals := dig "values" dict . | deepCopy }}
{{- include "ace-installer.featureCred.unsetPaths" (dict "vals" $vals "paths" $credPaths) }}
{{ $vals = mergeOverwrite $defaults $vals }}

{{- /* genCA renders a fresh CA per template run; under Argo CD the webhook hooks and cert Secret come from different renders, so let cert-manager own the kubestash webhook cert. */}}
{{- if dig "cert-manager" "enabled" false $.Values.helm.releases }}
{{ $kubestashCertManager := dict "enabled" (dig "helm" "releases" "kubestash" "values" "kubestash-operator" "apiserver" "servingCerts" "certManager" "enabled" true $vals) }}
{{ $vals = mergeOverwrite $vals (dict "helm" (dict "releases" (dict "kubestash" (dict "values" (dict "kubestash-operator" (dict "apiserver" (dict "servingCerts" (dict "certManager" $kubestashCertManager)))))))) }}
{{- end }}

{{- if eq (include "distro.openshift" $) "true" }}
{{ $vals = mergeOverwrite $vals (pick ($.Values.options | fromYaml) "distro") }}
{{- end }}

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opscenter-features
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/component: opscenter-features
    app.kubernetes.io/part-of: opscenter-core
spec:
  interval: 5m
  timeout: 30m
  releaseName: opscenter-features
  targetNamespace: kubeops
  storageNamespace: kubeops
  install:
    createNamespace: {{ $.Values.helm.createNamespace }}
    # crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    remediation:
      retries: -1
  {{- $crdManager := dig "akp-crd-manager" "enabled" false $.Values.helm.releases }}
  {{- $openshift := eq (include "distro.openshift" $) "true" }}
  {{- if or $crdManager $openshift }}
  dependsOn:
  {{- if $crdManager }}
  - name: akp-crd-manager
    namespace: {{ $.Release.Namespace }}
  {{- end }}
  {{- if $openshift }}
  - name: aceshifter
    namespace: {{ $.Release.Namespace }}
  {{- end }}
  {{- end }}
  chart:
    spec:
      chart: opscenter-features
      version: {{ .version | quote }}
      sourceRef:
        kind: HelmRepository
        name: bootstrap
        namespace: {{ $.Release.Namespace }}
  valuesFrom:
    - kind: Secret
      name: ace-installer-cred
      valuesKey: opscenter-features.yaml
{{- with $vals }}
  {{- dict "values" . | toYaml | nindent 2 }}
{{- end }}

{{- end }}
{{- end }}
