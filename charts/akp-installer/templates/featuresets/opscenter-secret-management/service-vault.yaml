{{- with (index .Values "helm" "releases" "service-vault") }}
{{- if .enabled }}

{{ $ips := list }}
{{- range $secret := $.Values.registry.imagePullSecrets }}
{{ $ips = append $ips (dict "name" $secret) }}
{{- end }}

{{ $platform := dig "releases" "ace" "values" "global" "platform" dict $.Values.helm }}

{{ $defaults := printf `
global:
  registryFQDN: %q
  imagePullSecrets: %v
clusterMetadata:
  name: ace
` (include "registry.ghcr" $)
  ($ips | toJson)
  | fromYaml }}

{{- with (dig "host" "" $platform) }}
{{ $_ := set $defaults "infra" (dict "host" . "hostType" (dig "hostType" "domain" $platform)) }}
{{- end }}

{{ $vals := dig "values" dict . }}
{{ $vals = mergeOverwrite $defaults $vals }}

{{- if eq (include "distro.openshift" $) "true" }}
{{ $distro := pick ($.Values.options | fromYaml) "distro" }}
{{ $vals = mergeOverwrite $vals $distro (dict "global" $distro) }}
{{- end }}

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: service-vault
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/component: service-vault
    app.kubernetes.io/part-of: opscenter-secret-management
spec:
  interval: 5m
  timeout: 30m
  releaseName: service-vault
  targetNamespace: kubevault
  storageNamespace: kubevault
  install:
    createNamespace: {{ $.Values.helm.createNamespace }}
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    remediation:
      retries: -1
  dependsOn:
  - name: opscenter-features
    namespace: {{ $.Release.Namespace }}
  {{- if (dig "cert-manager" "enabled" false $.Values.helm.releases) }}
  - name: cert-manager
    namespace: {{ $.Release.Namespace }}
  {{- end }}
  {{- if and (dig "gateway-api" "enabled" false $.Values.helm.releases) (eq (include "distro.openshift" $) "false") }}
  - name: gateway-api
    namespace: {{ $.Release.Namespace }}
  {{- end }}
  {{- if and (dig "catalog-manager" "enabled" false $.Values.helm.releases) (dig "service-gateway-presets" "enabled" false $.Values.helm.releases) }}
  - name: gateway
    namespace: ace
  {{- end }}
  chart:
    spec:
      chart: service-vault
      version: {{ .version | quote }}
      interval: 60m
      sourceRef:
        kind: HelmRepository
        name: appscode-charts-oci
        namespace: {{ $.Release.Namespace }}
{{- with $vals }}
  {{- dict "values" . | toYaml | nindent 2 }}
{{- end }}

{{- end }}
{{- end }}
