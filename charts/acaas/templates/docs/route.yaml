{{ if and (eq (toString .Values.global.platform.deploymentType) "Hosted") (index .Values "gateway" "enabled") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: docs
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ace
      namespace: {{ .Release.Namespace }}
      sectionName: https
  {{- if eq .Values.global.platform.hostType "domain" }}
  hostnames:
    - {{ .Values.global.platform.host }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /docs
      filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: kubedb.com
            path:
              type: ReplaceFullPath
              replaceFullPath: /docs/platform
            scheme: http
            statusCode: 301
{{- end }}
