{{- if and (eq (toString .Values.global.platform.deploymentType) "Hosted") (index .Values "ingress" "enabled") }}
apiVersion: v1
kind: Service
metadata:
  name: docs
  namespace: {{ .Release.Namespace }}
spec:
  externalName: {{ .Values.ingress.rules.docs.upstream }}
  sessionAffinity: None
  type: ExternalName
{{- end }}
