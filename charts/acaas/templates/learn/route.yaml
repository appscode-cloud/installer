{{ if and (eq (toString .Values.global.platform.deploymentType) "Hosted") (index .Values "gateway" "enabled") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: learn
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ace
      namespace: {{ .Release.Namespace }}
      sectionName: https
  {{- if eq .Values.global.platform.hostType "domain" }}
  hostnames:
    - {{ .Values.global.platform.host }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /learn
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: learn
          port: 443
          weight: 1
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: {{ .Values.gateway.rules.learn.upstream }}
{{- end }}
