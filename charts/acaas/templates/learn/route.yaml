{{- if and (eq (toString .Values.global.platform.deploymentType) "Hosted") (index .Values "gateway" "enabled") (index .Values "learn-ui" "enabled") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  name: learn
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acaas.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ace
      namespace: {{ .Release.Namespace }}
      sectionName: https
  {{- if eq .Values.global.platform.hostType "domain" }}
  hostnames:
    - {{ .Values.global.platform.host }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /learn
      backendRefs:
        - kind: Service
          name: {{ .Release.Name }}-learn-ui
          port: 80
{{- end }}
