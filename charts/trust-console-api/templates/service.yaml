apiVersion: v1
kind: Service
metadata:
  name: {{ include "trust-console-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trust-console-api.labels" . | nindent 4 }}
spec:
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: http
    # The hub serves h2c: Connect streaming needs HTTP/2 end to end.
    appProtocol: kubernetes.io/h2c
  selector:
    {{- include "trust-console-api.selectorLabels" . | nindent 4 }}
