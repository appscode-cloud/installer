{{- if (index .Values "gateway" "enabled") }}

{{- if (index .Values "gateway" "hosts") }}

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "s3proxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "s3proxy.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: ace
    namespace: ace
    sectionName: https
  {{- $hostnames := list }}
  {{- range .Values.gateway.hosts }}
    {{- if and .host (not (regexMatch "^([0-9]{1,3}\\.){3}[0-9]{1,3}$" .host)) (not (contains ":" .host)) }}
      {{- $hostnames = append $hostnames .host }}
    {{- end }}
  {{- end }}
  {{- if $hostnames }}
  hostnames:
  {{- range $hostnames }}
    - {{ . | quote }}
  {{- end }}
  {{- end }}

  rules:
  {{- range .Values.gateway.hosts }}
    {{- range .paths }}
  - matches:
    - path:
        type: PathPrefix
        value: {{ .path }}
    backendRefs:
    {{- if not (include "gatewayAPI.backendTLSPolicyVersion" $) }}
    - group: gateway.envoyproxy.io
      kind: Backend
      name: {{ include "s3proxy.fullname" $ }}
      namespace: {{ $.Release.Namespace }}
      weight: 1
    {{- else }}
    - group: ""
      kind: Service
      name: {{ include "s3proxy.fullname" $ }}
      namespace: {{ $.Release.Namespace }}
      port: {{ $.Values.service.port }}
      weight: 1
    {{- end }}
    {{- end }}
  {{- end }}

---
{{- $btlsVersion := include "gatewayAPI.backendTLSPolicyVersion" . }}
{{- if not $btlsVersion }}
{{- /* Without BackendTLSPolicy (e.g. OpenShift), upstream TLS is set on an Envoy Backend instead. */}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: {{ include "s3proxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  endpoints:
  - fqdn:
      hostname: {{ include "s3proxy.fullname" . }}.{{ .Release.Namespace }}.svc
      port: {{ .Values.service.port }}
  tls:
    caCertificateRefs:
    {{- if and
      (or (eq .Values.global.infra.tls.issuer "letsencrypt") (eq .Values.global.infra.tls.issuer "letsencrypt-staging"))
      (index .Values "gateway" "enabled") }}
    - group: ""
      kind: Secret
      name: {{ include "ace.fullname" . }}-acme-ca-cert
    {{- else }}
    - group: ""
      kind: Secret
      name: {{ include "ace.fullname" . }}-gw-cert
    {{- end }}
  {{- if eq (index .Values "global" "platform" "hostType") "ip" }}
    sni: {{ include "ace.fullname" . }}-s3proxy
  {{- else }}
    sni: {{ .Values.global.platform.host }}
  {{- end }}
{{- else }}
apiVersion: gateway.networking.k8s.io/{{ $btlsVersion }}
kind: BackendTLSPolicy
metadata:
  name: {{ include "ace.fullname" . }}-s3proxy
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
  - group: ""
    kind: Service
    name: {{ include "ace.fullname" . }}-s3proxy
  validation:
    caCertificateRefs:
    {{- if and
      (or (eq .Values.global.infra.tls.issuer "letsencrypt") (eq .Values.global.infra.tls.issuer "letsencrypt-staging"))
      (index .Values "gateway" "enabled") }}
    - group: ""
      kind: Secret
      name: {{ include "ace.fullname" . }}-acme-ca-cert
    {{- else }}
    - group: ""
      kind: Secret
      name: {{ include "ace.fullname" . }}-gw-cert
    {{- end }}
  {{- if eq (index .Values "global" "platform" "hostType") "ip" }}
    hostname: {{ include "ace.fullname" . }}-s3proxy
  {{- else }}
    hostname: {{ .Values.global.platform.host }}
  {{- end }}
{{- end }}
{{- end }}

{{- $tcpRouteVersion := include "gatewayAPI.tcpRouteVersion" . }}
{{- if $tcpRouteVersion }}

---
apiVersion: gateway.networking.k8s.io/{{ $tcpRouteVersion }}
kind: TCPRoute
metadata:
  name: {{ include "s3proxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: ace
    namespace: ace
    sectionName: s3proxy-tcp
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: {{ include "s3proxy.fullname" . }}
      namespace: {{ .Release.Namespace }}
      port: 4224
      weight: 1
{{- end }}
{{- end }}
