{{- if .Values.openfga.enabled }}
{{- $fn := include "trustconsole.fullname" . }}
{{- $o := .Values.openfga }}
{{- $img := include "trustconsole.image" (dict "root" . "image" $o.image) }}
{{- $ctrSec := dict "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true "capabilities" (dict "drop" (list "ALL")) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-openfga
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trustconsole.labels" . | nindent 4 }}
spec:
  ports:
  - { name: http, port: 8080, targetPort: http }
  selector:
    {{- include "trustconsole.selector" (dict "root" . "component" "openfga") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-openfga
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "trustconsole.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "trustconsole.selector" (dict "root" . "component" "openfga") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trustconsole.selector" (dict "root" . "component" "openfga") | nindent 8 }}
      annotations:
        checksum/db: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      {{- include "trustconsole.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      # The image has no shell, so the wait for Postgres is the migration's own retry (the Pod restarts until it connects).
      - name: migrate
        image: {{ $img }}
        imagePullPolicy: {{ $o.image.pullPolicy }}
        args: ["migrate"]
        securityContext:
          {{- toYaml $ctrSec | nindent 10 }}
        env:
        - { name: OPENFGA_DATASTORE_ENGINE, value: postgres }
        - name: OPENFGA_DATASTORE_URI
          valueFrom: { secretKeyRef: { name: {{ $fn }}-openfga-database, key: uri } }
      containers:
      - name: openfga
        image: {{ $img }}
        imagePullPolicy: {{ $o.image.pullPolicy }}
        args: ["run"]
        securityContext:
          {{- toYaml $ctrSec | nindent 10 }}
        env:
        - { name: OPENFGA_DATASTORE_ENGINE, value: postgres }
        - name: OPENFGA_DATASTORE_URI
          valueFrom: { secretKeyRef: { name: {{ $fn }}-openfga-database, key: uri } }
        - { name: OPENFGA_PLAYGROUND_ENABLED, value: "false" }
        ports:
        - { name: http, containerPort: 8080 }
        - { name: grpc, containerPort: 8081 }
        readinessProbe:
          httpGet: { path: /healthz, port: http }
        livenessProbe:
          httpGet: { path: /healthz, port: http }
          initialDelaySeconds: 10
        resources:
          {{- toYaml $o.resources | nindent 10 }}
      {{- with $o.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $o.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
