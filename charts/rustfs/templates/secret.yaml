apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rustfs.fullname" . }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ default (randAlpha 20) .Values.rustfs.auth.accessKeyId }}
  AWS_SECRET_ACCESS_KEY: {{ default (randAlphaNum 20) .Values.rustfs.auth.secretAccessKey }}
  {{- if .Values.rustfs.tls.mount }}
  AWS_ENDPOINTS: 'https://{{ include "rustfs.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}'
  {{- else }}
  AWS_ENDPOINTS: 'http://{{ include "rustfs.fullname" . }}.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}'
  {{- end }}
