{{ $infra := .Values.infra }}
{{- $deploymentType := "" }}
{{- if .Values.global }}
{{- $infra = .Values.global.infra }}
{{- if .Values.global.platform }}
{{- $deploymentType = .Values.global.platform.deploymentType }}
{{- end }}
{{- end }}

{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "platform-api.fullname" . }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "platform-api.workerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: worker
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "platform-api.workerSelectorLabels" . | nindent 8 }}
    spec:
      {{- include "appscode.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "appscode.serviceAccountName" . }}
      {{- if eq "true" ( include "distro.openshift" . ) }}
      securityContext:
        {{- toYaml (omit .Values.podSecurityContext "runAsUser" "runAsGroup" "fsGroup" "supplementalGroups") | nindent 8 }}
      {{- else }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          {{- if eq "true" ( include "distro.openshift" . ) }}
          securityContext:
            {{- toYaml (omit .Values.securityContext "runAsUser" "runAsGroup" "fsGroup" "supplementalGroups") | nindent 12 }}
          {{- else }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          image: {{ include "image.registry" . }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - worker
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
          {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
            - name: GCP_MARKETPLACE_SKIP_METERING_SERVICE
              value: {{ .Values.settings.skipGCPMarketplaceMeteringService | quote }}
          {{- with .Values.settings.secretName.gcpMarketplaceReportingSecret }}
            - name: GCP_MARKETPLACE_ENCODED_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: reporting-key
            - name: GCP_MARKETPLACE_CONSUMER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: consumer-id
          {{- end }}
          {{- if or (and (include "settings.objstoreSecretName" .) (eq $infra.objstore.provider "gcs")) (eq $deploymentType "Hosted") }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: {{ $infra.objstore.mountPath }}/sa.json
          {{- end }}
          {{- if and (include "settings.objstoreSecretName" .) (eq $infra.objstore.provider "s3") }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "settings.objstoreSecretName" . }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "settings.objstoreSecretName" . }}
                  key: AWS_SECRET_ACCESS_KEY
            {{- if $infra.objstore.s3.AWS_REGION }}
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: {{ include "settings.objstoreSecretName" . }}
                  key: AWS_REGION
            {{- end }}
          {{- end }}
          {{- if and (include "settings.objstoreSecretName" .) (eq $infra.objstore.provider "azure") }}
            - name: AZURE_STORAGE_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: {{ include "settings.objstoreSecretName" . }}
                  key: AZURE_ACCOUNT_NAME
            - name: AZURE_STORAGE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "settings.objstoreSecretName" . }}
                  key: AZURE_ACCOUNT_KEY
          {{- end }}
          {{- if (include "settings.platformConfigSecretName" .) }}
            - name: B3_CONFIG_SECRET_NAME
              value: {{ include "settings.platformConfigSecretName" . }}
          {{- end }}
          {{- if (include "settings.platformUserConfigSecretName" .) }}
            - name: B3_USER_CONFIG_SECRET_NAME
              value: {{ include "settings.platformUserConfigSecretName" . }}
          {{- end }}
          {{- if (include "settings.platformSystemConfigSecretName" .) }}
            - name: B3_SYSTEM_CONFIG_SECRET_NAME
              value: {{ include "settings.platformSystemConfigSecretName" . }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: config
              mountPath: /data/b3/conf
            {{- if (include "settings.objstoreSecretName" .) }}
            - name: objstore-cred
              mountPath: {{ $infra.objstore.mountPath }}
            {{- end }}
            {{- if (include "settings.caProviderClass" .) }}
            - name: cacerts
              mountPath: /etc/ssl/certs
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          projected:
            sources:
            {{- with $secretName := (include "settings.platformConfigSecretName" .) }}
            - secret:
                name: {{ $secretName }}
                items:
                - key: app.ini
                  path: app.ini
                  mode: 420
            {{- end }}
            {{- with $secretName := (include "settings.platformSystemConfigSecretName" .) }}
            - secret:
                name: {{ $secretName }}
                items:
                - key: system.ini
                  path: system.ini
                  mode: 420
            {{- end }}
            {{- with $secretName := (include "settings.platformUserConfigSecretName" .) }}
            - secret:
                name: {{ $secretName }}
                items:
                - key: user.ini
                  path: user.ini
                  mode: 420
            {{- end }}
        - name: data
          emptyDir: {}
        {{- with $secretName := (include "settings.objstoreSecretName" .) }}
        - name: objstore-cred
          secret:
            defaultMode: 420
            secretName: {{ $secretName }}
        {{- end }}
        {{- with $cpc := (include "settings.caProviderClass" .) }}
        - name: cacerts
          csi:
            driver: cacerts.csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              os: debian
              caProviderClasses: {{ $cpc }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
