{{ $infra := .Values.infra }}
{{- $deploymentType := "" }}
{{- if .Values.global }}
{{- $infra = .Values.global.infra }}
{{- if .Values.global.platform }}
{{- $deploymentType = .Values.global.platform.deploymentType }}
{{- end }}
{{- end }}

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "platform-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platform-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  podManagementPolicy: "Parallel"
  serviceName: {{ include "platform-api.fullname" . }}-headless
  selector:
    matchLabels:
      {{- include "platform-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: {{ .Chart.Name }}
        {{- with .Values.podAnnotations }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "platform-api.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "appscode.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "appscode.serviceAccountName" . }}
      {{- if eq "true" ( include "distro.openshift" . ) }}
      securityContext:
        {{- toYaml (omit .Values.podSecurityContext "runAsUser" "runAsGroup" "fsGroup" "supplementalGroups") | nindent 8 }}
      {{- else }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- if eq "true" ( include "distro.openshift" . ) }}
          securityContext:
            {{- toYaml (omit .Values.securityContext "runAsUser" "runAsGroup" "fsGroup" "supplementalGroups") | nindent 12 }}
          {{- else }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          image: {{ include "image.registry" . }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - api
            {{- if include "appscode.license" . }}
            - --license-file=/var/run/secrets/appscode/license/key.txt
            {{- end }}
          ports:
            - name: http
              containerPort: 3003
              protocol: TCP
          startupProbe:
            {{- include "platform-api.probe" . | nindent 12 }}
            # wait for cert and nats to be ready
            initialDelaySeconds: 60
            timeoutSeconds: 5
            failureThreshold: 18
            periodSeconds: 30
          livenessProbe:
            {{- include "platform-api.probe" . | nindent 12 }}
            # /api/v1/version is served by the same process as every other request, so it
            # stalls whenever the process does. Restart only a genuinely wedged process
            # (~2m); the 1s/30s default kills all replicas together on transient slowness.
            timeoutSeconds: 10
            periodSeconds: 20
            failureThreshold: 6
          readinessProbe:
            {{- include "platform-api.probe" . | nindent 12 }}
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
          {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
            - name: GCP_MARKETPLACE_SKIP_METERING_SERVICE
              value: {{ .Values.settings.skipGCPMarketplaceMeteringService | quote }}
          {{- with .Values.settings.secretName.gcpMarketplaceReportingSecret }}
            - name: GCP_MARKETPLACE_ENCODED_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: reporting-key
            - name: GCP_MARKETPLACE_CONSUMER_ID
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: consumer-id
          {{- end }}
          {{- with include "platform-api.b3Env" (dict "root" . "infra" $infra "deploymentType" $deploymentType) | trim }}
            {{- . | nindent 12 }}
          {{- end }}
            - name: GEO_LOCATION_DB_PATH
              value: /data/b3/maxmind-geoip/GeoLite2-City.mmdb
          volumeMounts:
            - name: maxmind-mmdb
              mountPath: /data/b3/maxmind-geoip
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /data
            - name: config
              mountPath: /data/b3/conf
            {{- if (include "settings.objstoreSecretName" .) }}
            - name: objstore-cred
              mountPath: {{ $infra.objstore.mountPath }}
            {{- end }}
            {{- if include "appscode.license" . }}
            - mountPath: /var/run/secrets/appscode/license
              name: license
            {{- end }}
            {{- if (include "settings.caProviderClass" .) }}
            - name: cacerts
              mountPath: /etc/ssl/certs
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        - name: gotenberg
          image: {{ include "gotenberg.registry" . }}/{{ .Values.gotenberg.repository }}:{{ .Values.gotenberg.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.gotenberg.pullPolicy }}
          ports:
            - containerPort: 3000
              protocol: TCP
      initContainers:
        {{- with .Values.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        - name: maxmind-mmdb
          {{- if eq "true" ( include "distro.openshift" . ) }}
          securityContext:
            {{- toYaml (omit .Values.securityContext "runAsUser" "runAsGroup" "fsGroup" "supplementalGroups") | nindent 12 }}
          {{- else }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- end }}
          image: {{ include "geoipdb.registry" . }}/{{ .Values.geoipdb.repository }}:{{ .Values.geoipdb.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.geoipdb.pullPolicy }}
          command: [ "sh", "-c", "cp /GeoLite2-City.mmdb /data/b3/maxmind-geoip/GeoLite2-City.mmdb" ]
          volumeMounts:
            - name: maxmind-mmdb
              mountPath: /data/b3/maxmind-geoip
{{- if eq (dig "akp" "mode" "" (default dict .Values.global)) "v2_only" }}
        {{- /* b3 order in v2_only (b3 docs/iam-modes.md): tables, NATS accounts, first site administrator. Each is safe to retry. */}}
        {{- $mounts := list (dict "name" "tmp" "mountPath" "/tmp") (dict "name" "data" "mountPath" "/data") (dict "name" "config" "mountPath" "/data/b3/conf") }}
        {{- if include "settings.objstoreSecretName" . }}{{ $mounts = append $mounts (dict "name" "objstore-cred" "mountPath" $infra.objstore.mountPath) }}{{ end }}
        {{- if include "settings.caProviderClass" . }}{{ $mounts = append $mounts (dict "name" "cacerts" "mountPath" "/etc/ssl/certs") }}{{ end }}
        {{- /* b3's [nats] *_CREDS paths; ace's setup Job mounts the same Secret there in the other modes. */}}
        {{- if include "settings.natsSecretName" . }}{{ $mounts = append $mounts (dict "name" "nats-cred" "mountPath" (dig "nats" "mountPath" "/nats/creds" .Values.settings)) }}{{ end }}
        {{- range .Values.volumeMounts }}{{ $mounts = append $mounts . }}{{ end }}
        {{- $steps := list (dict "name" "migrate" "args" (list "migrate")) }}
        {{- if .Values.settings.secretName.setupConfig }}
        {{- $steps = append $steps (dict "name" "setup" "args" (list "dev" "--setup-config=/setup/config.yaml" "--timeout=10m") "setup" true) }}
        {{- end }}
        {{- if .Values.iam.bootstrapAdmin.enabled }}
        {{- $steps = append $steps (dict "name" "bootstrap-admin" "args" (list "admin" "iam-bootstrap-admin" "--name" .Values.iam.bootstrapAdmin.name "--email" .Values.iam.bootstrapAdmin.email "--full-name" .Values.iam.bootstrapAdmin.fullName)) }}
        {{- end }}
        {{- range $steps }}
        - name: {{ .name }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: {{ include "image.registry" $ }}/{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            {{- toYaml .args | nindent 12 }}
          {{- with include "platform-api.b3Env" (dict "root" $ "infra" $infra "deploymentType" $deploymentType) | trim }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- toYaml $mounts | nindent 12 }}
            {{- if .setup }}
            - name: setup-config
              mountPath: /setup
              readOnly: true
            {{- end }}
        {{- end }}
{{- end }}
      volumes:
        - name: maxmind-mmdb
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: config
          projected:
            sources:
            {{- with $secretName := (include "settings.platformConfigSecretName" .) }}
            - secret:
                name: {{ $secretName }}
                items:
                - key: app.ini
                  path: app.ini
                  mode: 420
            {{- end }}
            {{- with $secretName := (include "settings.platformSystemConfigSecretName" .) }}
            - secret:
                name: {{ $secretName }}
                items:
                - key: system.ini
                  path: system.ini
                  mode: 420
            {{- end }}
            {{- with $secretName := (include "settings.platformUserConfigSecretName" .) }}
            - secret:
                name: {{ $secretName }}
                items:
                - key: user.ini
                  path: user.ini
                  mode: 420
            {{- end }}
        {{- with $secretName := (include "settings.objstoreSecretName" .) }}
        - name: data
          emptyDir: {}
        - name: objstore-cred
          secret:
            defaultMode: 420
            secretName: {{ $secretName }}
        {{- else }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "platform-api.fullname" . }}-data
        {{- end }}
        {{- if include "appscode.license" . }}
        - name: license
          secret:
            defaultMode: 420
            secretName: {{ include "platform-api.fullname" . }}-license
        {{- end }}
        {{- if and (eq (dig "akp" "mode" "" (default dict .Values.global)) "v2_only") .Values.settings.secretName.setupConfig }}
        - name: setup-config
          secret:
            secretName: {{ .Values.settings.secretName.setupConfig }}
        {{- end }}
        {{- if eq (dig "akp" "mode" "" (default dict .Values.global)) "v2_only" }}
        {{- with $secretName := (include "settings.natsSecretName" .) }}
        - name: nats-cred
          secret:
            defaultMode: 420
            secretName: {{ $secretName }}
        {{- end }}
        {{- end }}
        {{- with $cpc := (include "settings.caProviderClass" .) }}
        - name: cacerts
          csi:
            driver: cacerts.csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              os: debian
              caProviderClasses: {{ $cpc }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      {{- else }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "platform-api.selectorLabels" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
