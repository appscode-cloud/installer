{{- if .Values.b3.enabled }}
{{- $fn := include "kubepatch.fullname" . }}
{{- $name := include "kubepatch.b3name" . }}
{{- $b3 := .Values.b3 }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubepatch.labels" . | nindent 4 }}
spec:
  ports:
  - { name: http, port: 80, targetPort: http }
  selector:
    {{- include "kubepatch.selector" (dict "root" . "component" "b3") | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubepatch.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
  - { name: http, port: 80, targetPort: http }
  selector:
    {{- include "kubepatch.selector" (dict "root" . "component" "b3") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubepatch.labels" . | nindent 4 }}
spec:
  replicas: {{ $b3.replicaCount }}
  podManagementPolicy: Parallel
  serviceName: {{ $name }}-headless
  selector:
    matchLabels:
      {{- include "kubepatch.selector" (dict "root" . "component" "b3") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubepatch.selector" (dict "root" . "component" "b3") | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: b3
        # app.ini is a Secret made in secrets.yaml; restart when it changes.
        checksum/app-ini: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum | trunc 16 }}
        {{- with $b3.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "kubepatch.imagePullSecrets" . | nindent 6 }}
      securityContext:
        fsGroup: 65534
      initContainers:
      # The order is b3's own (docs/iam-modes.md, "A fresh install in v2_only"): the tables of the product, the first
      # site administrator, then the NATS accounts and the site organization (b3 dev), then the first site administrator, whose NATS account needs the setup first. Each retries until what it needs is up.
      - name: migrate
        image: {{ include "kubepatch.image" (dict "root" . "image" $b3.image) }}
        imagePullPolicy: {{ $b3.image.pullPolicy }}
        args: ["migrate"]
        securityContext:
          {{- toYaml $b3.securityContext | nindent 10 }}
        volumeMounts:
        - { name: tmp, mountPath: /tmp }
        - { name: data, mountPath: /data }
        - { name: config, mountPath: /data/b3/conf }
        {{- if .Values.nats.enabled }}
        - { name: nats-creds, mountPath: /nats/creds, readOnly: true }
        {{- end }}
      {{- if .Values.nats.enabled }}
      - name: setup
        image: {{ include "kubepatch.image" (dict "root" . "image" $b3.image) }}
        imagePullPolicy: {{ $b3.image.pullPolicy }}
        args: ["dev", "--setup-config=/setup/config.yaml", "--timeout=10m"]
        securityContext:
          {{- toYaml $b3.securityContext | nindent 10 }}
        volumeMounts:
        - { name: tmp, mountPath: /tmp }
        - { name: data, mountPath: /data }
        - { name: config, mountPath: /data/b3/conf }
        {{- if .Values.nats.enabled }}
        - { name: nats-creds, mountPath: /nats/creds, readOnly: true }
        {{- end }}
        - { name: setup-config, mountPath: /setup, readOnly: true }
      {{- end }}
      {{- if .Values.akpBootstrap.enabled }}
      - name: bootstrap-admin
        image: {{ include "kubepatch.image" (dict "root" . "image" $b3.image) }}
        imagePullPolicy: {{ $b3.image.pullPolicy }}
        args: ["admin", "iam-bootstrap-admin", "--name", {{ .Values.casdoor.admin.username | quote }}, "--email", {{ .Values.casdoor.admin.email | quote }}, "--full-name", {{ .Values.casdoor.admin.displayName | quote }}]
        securityContext:
          {{- toYaml $b3.securityContext | nindent 10 }}
        volumeMounts:
        - { name: tmp, mountPath: /tmp }
        - { name: data, mountPath: /data }
        - { name: config, mountPath: /data/b3/conf }
        {{- if .Values.nats.enabled }}
        - { name: nats-creds, mountPath: /nats/creds, readOnly: true }
        {{- end }}
      {{- end }}
      containers:
      - name: b3
        image: {{ include "kubepatch.image" (dict "root" . "image" $b3.image) }}
        imagePullPolicy: {{ $b3.image.pullPolicy }}
        args: ["api"]
        securityContext:
          {{- toYaml $b3.securityContext | nindent 10 }}
        ports:
        - { name: http, containerPort: 3003 }
        # v2_only serves neither /healthz nor /api/v1/version: a Connect call that needs no sign-in is the probe.
        startupProbe:
          exec:
            command: {{ include "kubepatch.b3probe" . }}
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60
        livenessProbe:
          exec:
            command: {{ include "kubepatch.b3probe" . }}
          timeoutSeconds: 10
          periodSeconds: 20
          failureThreshold: 6
        readinessProbe:
          exec:
            command: {{ include "kubepatch.b3probe" . }}
          timeoutSeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml $b3.resources | nindent 10 }}
        volumeMounts:
        - { name: tmp, mountPath: /tmp }
        - { name: data, mountPath: /data }
        - { name: config, mountPath: /data/b3/conf }
        {{- if .Values.nats.enabled }}
        - { name: nats-creds, mountPath: /nats/creds, readOnly: true }
        {{- end }}
      volumes:
      - name: tmp
        emptyDir: {}
      {{- if .Values.nats.enabled }}
      - name: nats-creds
        secret:
          secretName: {{ $fn }}-nats-creds
      {{- end }}
      - name: setup-config
        secret:
          secretName: {{ $fn }}-setup-config
      - name: config
        secret:
          secretName: {{ $fn }}-app-ini
          items:
          - { key: app.ini, path: app.ini, mode: 0444 }
          - { key: user.ini, path: user.ini, mode: 0444 }
          - { key: system.ini, path: system.ini, mode: 0444 }
      {{- with $b3.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $b3.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      {{- with .Values.persistence.storageClassName }}
      storageClassName: {{ . }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.b3 }}
{{- if $b3.worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubepatch.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "kubepatch.selector" (dict "root" . "component" "b3-worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubepatch.selector" (dict "root" . "component" "b3-worker") | nindent 8 }}
      annotations:
        checksum/app-ini: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum | trunc 16 }}
    spec:
      {{- include "kubepatch.imagePullSecrets" . | nindent 6 }}
      containers:
      - name: worker
        image: {{ include "kubepatch.image" (dict "root" . "image" $b3.image) }}
        imagePullPolicy: {{ $b3.image.pullPolicy }}
        args: ["worker"]
        securityContext:
          {{- toYaml $b3.securityContext | nindent 10 }}
        volumeMounts:
        - { name: tmp, mountPath: /tmp }
        - { name: data, mountPath: /data }
        - { name: config, mountPath: /data/b3/conf }
      volumes:
      - { name: tmp, emptyDir: {} }
      - { name: data, emptyDir: {} }
      - name: config
        secret:
          secretName: {{ $fn }}-app-ini
          items:
          - { key: app.ini, path: app.ini, mode: 0444 }
          - { key: user.ini, path: user.ini, mode: 0444 }
          - { key: system.ini, path: system.ini, mode: 0444 }
{{- end }}
{{- end }}
