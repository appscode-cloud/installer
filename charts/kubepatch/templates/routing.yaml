{{- $fn := include "kubepatch.fullname" . }}
{{- $host := include "kubepatch.host" . }}
{{- $routes := include "kubepatch.routes" . | fromJsonArray }}
{{- $casdoorHost := include "kubepatch.casdoorHost" . }}
{{- $tlsSecret := include "kubepatch.tlsSecret" . }}
{{- if eq .Values.routing.mode "gateway" }}
{{- $gw := .Values.routing.gateway }}
{{- if $gw.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $fn }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubepatch.labels" . | nindent 4 }}
  {{- with $gw.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ $gw.className }}
  listeners:
  {{- if ne .Values.tls.mode "none" }}
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: {{ $tlsSecret }}
  {{- else }}
  - name: http
    protocol: HTTP
    port: 80
  {{- end }}
    allowedRoutes:
      namespaces:
        from: Same
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fn }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubepatch.labels" . | nindent 4 }}
spec:
  {{- include "kubepatch.parentRefs" (dict "root" .) | nindent 2 }}
  hostnames:
  - {{ $host | quote }}
  rules:
  {{- if .Values.routing.rootRedirect }}
  - matches:
    - path:
        type: Exact
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        path:
          type: ReplaceFullPath
          replaceFullPath: {{ .Values.routing.rootRedirect }}
        statusCode: 302
  {{- end }}
  {{- range $routes }}
  - matches:
    - path:
        type: PathPrefix
        value: {{ .path }}
    {{- if .rewrite }}
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: {{ .rewrite }}
    {{- end }}
    backendRefs:
    - group: ""
      kind: Service
      name: {{ .svc }}
      port: {{ .port }}
      weight: 1
    {{- if .timeout }}
    timeouts:
      backendRequest: {{ .timeout }}
      request: {{ .timeout }}
    {{- end }}
  {{- end }}
{{- if .Values.casdoor.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fn }}-casdoor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubepatch.labels" . | nindent 4 }}
spec:
  {{- include "kubepatch.parentRefs" (dict "root" .) | nindent 2 }}
  hostnames:
  - {{ $casdoorHost | quote }}
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: {{ $fn }}-casdoor
      port: 8000
      weight: 1
{{- end }}
{{- if $gw.backendTrafficPolicy }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ $fn }}
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ $fn }}
  retry:
    numRetries: 2
    retryOn:
      triggers:
      - connect-failure
      - refused-stream
      - reset-before-request
    perRetry:
      backOff:
        baseInterval: 100ms
        maxInterval: 1s
{{- end }}
{{- else if eq .Values.routing.mode "ingress" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fn }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubepatch.labels" . | nindent 4 }}
  {{- with .Values.routing.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.routing.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if ne .Values.tls.mode "none" }}
  tls:
  - secretName: {{ $tlsSecret }}
    hosts:
    - {{ $host | quote }}
    {{- if .Values.casdoor.enabled }}
    - {{ $casdoorHost | quote }}
    {{- end }}
  {{- end }}
  rules:
  - host: {{ $host | quote }}
    http:
      paths:
      {{- range $routes }}
      - path: {{ .path }}
        pathType: Prefix
        backend:
          service:
            name: {{ .svc }}
            port:
              number: {{ .port }}
      {{- end }}
  {{- if .Values.casdoor.enabled }}
  - host: {{ $casdoorHost | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $fn }}-casdoor
            port:
              number: 8000
  {{- end }}
{{- end }}
