{{- /*
  Every Secret that embeds a generated value is rendered here, so each value is drawn once per render
  and the Secrets agree. A value is generated at the first install and read back (lookup) afterwards.
*/ -}}
{{- $fn := include "kubepatch.fullname" . -}}
{{- $ns := .Release.Namespace -}}
{{- $credName := include "kubepatch.credentialsSecret" . -}}
{{- $existing := lookup "v1" "Secret" $ns $credName -}}
{{- $have := dict -}}
{{- if $existing -}}
{{- range $k, $v := $existing.data }}{{ $_ := set $have $k ($v | b64dec) }}{{ end -}}
{{- end -}}
{{- $c := dict -}}
{{- range $k, $len := dict "postgres-password" 32 "akp-db-password" 32 "patchconsole-db-password" 32 "casdoor-db-password" 32 "casdoor-admin-password" 24 "admin-password" 20 "akp-secret-key" 64 "kms-master-key" 42 "akp-jwt-secret" 43 "akp-casdoor-client-secret" 40 "patch-casdoor-client-secret" 40 "patch-iam-root-key" 48 "setup-password" 24 -}}
{{- if hasKey $have $k -}}
{{- $_ := set $c $k (get $have $k) -}}
{{- else if and $.Values.credentials.existingSecret $existing -}}
{{- fail (printf "Secret %s has no key %s" $credName $k) -}}
{{- else -}}
{{- $_ := set $c $k (ternary "CHANGEME-existing-secret-not-readable" (randAlphaNum (int $len)) (not (empty $.Values.credentials.existingSecret))) -}}
{{- end -}}
{{- end -}}
{{- /* The key Casdoor signs tokens with. */ -}}
{{- $jwtCert := dict -}}
{{- if and (hasKey $have "casdoor-jwt-cert") (hasKey $have "casdoor-jwt-key") -}}
{{- $_ := set $jwtCert "Cert" (get $have "casdoor-jwt-cert") -}}
{{- $_ := set $jwtCert "Key" (get $have "casdoor-jwt-key") -}}
{{- else -}}
{{- $g := genSelfSignedCert "kubepatch-casdoor" nil nil 7300 -}}
{{- $_ := set $jwtCert "Cert" $g.Cert -}}
{{- $_ := set $jwtCert "Key" $g.Key -}}
{{- end -}}
{{- $_ := set $c "inbox-jwt-key" (default (genPrivateKey "rsa") (get $have "inbox-jwt-key")) -}}
{{- $_ := set $c "casdoor-jwt-cert" $jwtCert.Cert -}}
{{- $_ := set $c "casdoor-jwt-key" $jwtCert.Key -}}
{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $credName }}
  namespace: {{ $ns }}
  labels:
    {{- include "kubepatch.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
{{- range $k, $v := $c }}
  {{ $k }}: {{ $v | b64enc }}
{{- end }}
{{- end }}
{{- $host := include "kubepatch.host" . }}
{{- $public := include "kubepatch.publicUrl" . }}
{{- $b3 := .Values.b3 }}
{{- $pg := .Values.postgres }}
{{- if .Values.b3.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fn }}-app-ini
  namespace: {{ $ns }}
  labels:
    {{- include "kubepatch.labels" . | nindent 4 }}
stringData:
  # b3 reads these two files too; they stay empty. It writes them back as Secrets when an administrator
  # edits platform settings in the UI, which this chart does not support (all settings are in app.ini).
  user.ini: "; unused"
  system.ini: "; unused"
  app.ini: |-
    APP_NAME = {{ $b3.appName }}
    RUN_MODE = {{ $b3.runMode }}
    DEPLOYMENT_TYPE = {{ .Values.global.platform.deploymentType }}

    [server]
    PROTOCOL      = http
    DOMAIN        = {{ $host }}
    BASE_URL      = {{ $public }}/
    LANDING_PAGE  = home
    APP_DATA_PATH = /data

    [database]
    DB_TYPE  = postgres
    HOST     = {{ include "kubepatch.pgHost" . }}:{{ include "kubepatch.pgPort" . }}
    NAME     = {{ $pg.databases.akp.name }}
    USER     = {{ $pg.databases.akp.user }}
    PASSWD   = {{ index $c "akp-db-password" }}
    SSL_MODE = {{ include "kubepatch.pgSslmode" . }}
    LOG_SQL  = false

    [session]
    PROVIDER = {{ $b3.session.provider }}
    {{- if $b3.session.providerConfig }}
    PROVIDER_CONFIG = {{ $b3.session.providerConfig }}
    {{- end }}
    COOKIE_NAME = i_like_kubepatch
    COOKIE_SECURE = true
    ; SameSiteDefaultMode = 1 SameSiteLaxMode = 2 SameSiteStrictMode = 3 SameSiteNoneMode = 4
    COOKIE_SAME_SITE = 2

    [cache]
    ADAPTER = {{ $b3.cache.adapter }}
    {{- if $b3.cache.host }}
    HOST = {{ $b3.cache.host }}
    {{- end }}
    INTERVAL = 60

    [log]
    MODE = console
    LEVEL = {{ $b3.logLevel }}

    [oauth2]
    JWT_SECRET = {{ index $c "akp-jwt-secret" }}

    ; iam derives its keys from SECRET_KEY: never change it after the first start.
    [security]
    SECRET_KEY = {{ index $c "akp-secret-key" }}
    CSRF_COOKIE_HTTP_ONLY = false

    ; Encrypts secrets b3 stores (cluster credentials, tokens): never change it after the first start.
    [kms]
    ; 42 letters and digits plus "A=" are 32 bytes in base64, as the key wants.
    MASTER_KEY_URL = 'base64key://{{ index $c "kms-master-key" }}A='

    [service]
    DISABLE_REGISTRATION = true
    REQUIRE_SIGNIN_VIEW = false

    [iam]
    MODE = {{ $b3.iam.mode }}
    PUBLIC_URL = {{ $public }}
    PUBLIC_PATH = /iam
    FEDERATION_ENABLED = {{ $b3.iam.federation.enabled }}
    SCIM_ENABLED = {{ $b3.iam.scim.enabled }}
    CASDOOR_ENDPOINT = {{ default (printf "http://%s.%s.svc:8000" (include "kubepatch.casdoorName" .) $ns) .Values.casdoor.endpoint }}
    CASDOOR_CLIENT_ID = {{ .Values.casdoor.akpApplication.clientId }}
    CASDOOR_CLIENT_SECRET = {{ index $c "akp-casdoor-client-secret" }}
    CASDOOR_ORGANIZATION = {{ .Values.casdoor.organization }}
    CASDOOR_APPLICATION = {{ .Values.casdoor.akpApplication.name }}
    CASDOOR_REDIRECT_URI = {{ $public }}/iam/casdoor/callback
    CASDOOR_ADOPT_BY_NAME = true

    ; b3 refuses to start without an inbox server address and a key to sign its admin token. No inbox server runs
    ; here: the address is where one would be, b3 only logs that it does not answer.
    [inbox_server]
    JMAP_URL = {{ default (printf "http://inbox-server-jmap.%s.svc" $ns) $b3.inbox.jmapURL }}
    WEB_ADMIN_URL = {{ default (printf "http://inbox-server.%s.svc:8080" $ns) $b3.inbox.webAdminURL }}
    EMAIL_DOMAIN = {{ $host }}
    ENCODED_ADMIN_JWT_PRIVATE_KEY = {{ index $c "inbox-jwt-key" | b64enc }}

    [nats]
    ENABLED = {{ .Values.nats.enabled }}
{{- if .Values.nats.enabled }}
    OPERATOR_CREDS = /nats/creds/Operator.creds
    SYSTEM_CREDS = /nats/creds/SYS.creds
    SYSTEM_USER_CREDS = /nats/creds/sys.creds
    ADMIN_CREDS = /nats/creds/ADMIN.creds
    ADMIN_USER_CREDS = /nats/creds/admin.creds
    INCLUSTER_ADDR = {{ include "kubepatch.natsUrl" . }}
    WEBSOCKET_ADDR = wss://{{ $host }}{{ include "kubepatch.portSuffix" . }}/nats
    REPLICAS = 1
    SHARD_COUNT = 1
{{- end }}
{{- with $b3.smtp }}
{{- if .enabled }}

    [mailer]
    ENABLED = true
    MAILER_TYPE = smtp
    HOST = {{ .host }}
    IS_TLS_ENABLED = {{ .tlsEnabled }}
    FROM = {{ .from }}
    USER = {{ .username }}
    PASSWD = {{ include "kubepatch.secretKey" (dict "root" $ "name" .existingSecret "key" "password") }}
{{- end }}
{{- end }}
{{- if $b3.cadence.host }}

    [cadence]
    HOST = {{ $b3.cadence.host }}
    PORT = {{ $b3.cadence.port }}
    DOMAIN = {{ $b3.cadence.domain }}
    TASK_LIST = {{ $b3.cadence.taskList }}
{{- end }}
{{- with $b3.extraAppIni }}

{{ . | indent 4 }}
{{- end }}
{{- end }}
{{- if .Values.b3.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fn }}-setup-config
  namespace: {{ $ns }}
  labels:
    {{- include "kubepatch.labels" . | nindent 4 }}
stringData:
  config.yaml: |
    apiVersion: ace.appscode.com/v1alpha1
    kind: AceSetupConfig
    deploymentType: {{ .Values.global.platform.deploymentType }}
    nats:
      exports: true
      reloadNatsAccounts: true
    admin:
      username: {{ .Values.casdoor.admin.username }}
      email: {{ .Values.casdoor.admin.email }}
      displayName: {{ .Values.casdoor.admin.displayName }}
      orgname: {{ .Values.b3.siteOrganization }}
      # Not a login: Casdoor holds the password people sign in with.
      password: {{ index $c "setup-password" }}
    selfManagement:
      import: false
{{- end }}
{{- if (index .Values "patch-console-api" "enabled") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-patch-console-api-database
  namespace: {{ $ns }}
  labels:
    {{- include "kubepatch.labels" . | nindent 4 }}
stringData:
  url: {{ printf "postgres://%s:%s@%s:%v/%s?sslmode=%s" $pg.databases.patchconsole.user (index $c "patchconsole-db-password") (include "kubepatch.pgHost" .) (include "kubepatch.pgPort" .) $pg.databases.patchconsole.name (include "kubepatch.pgSslmode" .) | quote }}
{{- end }}
{{- if .Values.casdoor.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fn }}-casdoor-conf
  namespace: {{ $ns }}
  labels:
    {{- include "kubepatch.labels" . | nindent 4 }}
stringData:
  app.conf: |
    appname = casdoor
    httpport = 8000
    runmode = prod
    copyrequestbody = true
    driverName = postgres
    dataSourceName = user={{ $pg.databases.casdoor.user }} password={{ index $c "casdoor-db-password" }} host={{ include "kubepatch.pgHost" . }} port={{ include "kubepatch.pgPort" . }} sslmode={{ include "kubepatch.pgSslmode" . }} dbname={{ $pg.databases.casdoor.name }}
    dbName = {{ $pg.databases.casdoor.name }}
    tableNamePrefix =
    showSql = false
    redisEndpoint =
    defaultStorageProvider =
    isCloudIntranet = false
    authState = "casdoor"
    socks5Proxy = ""
    verificationCodeTimeout = 10
    initScore = 0
    logPostOnly = true
    isUsernameLowered = false
    origin = {{ include "kubepatch.casdoorPublicUrl" . }}
    originFrontend =
    staticBaseUrl = "https://cdn.casbin.org"
    isDemoMode = false
    batchSize = 100
    showGithubCorner = false
    forceLanguage = ""
    defaultLanguage = "en"
    defaultApplication = "{{ .Values.casdoor.patchApplication.name }}"
    maxItemsForFlatMenu = 7
    enableErrorMask = false
    enableGzip = true
    inactiveTimeoutMinutes =
    ldapServerPort = 389
    ldapsCertId = ""
    ldapsServerPort = 636
    radiusServerPort = 1812
    radiusDefaultOrganization = "built-in"
    radiusSecret = "secret"
    quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
    logConfig = {"adapter":"console"}
    initAdminPassword = {{ index $c "casdoor-admin-password" | quote }}
    initDataNewOnly = true
    initDataFile = "/conf/init_data.json"
    frontendBaseDir = "../cc_0"
  init_data.json: |
    {{- $org := .Values.casdoor.organization }}
    {
      "organizations": [
        {
          "owner": "admin",
          "name": {{ $org | quote }},
          "displayName": "Kubepatch",
          "passwordType": "bcrypt",
          "passwordOptions": ["AtLeast6"],
          "countryCodes": ["US"],
          "languages": ["en"],
          "tags": [],
          "accountItems": [],
          "mfaItems": [{"name": "Needed", "rule": {{ .Values.casdoor.mfa.rule | quote }}}],
          "initScore": 0,
          "isProfilePublic": false,
          "enableSoftDeletion": false
        }
      ],
      "certs": [
        {
          "owner": "admin",
          "name": "cert-kubepatch",
          "displayName": "Kubepatch signing certificate",
          "scope": "JWT",
          "type": "x509",
          "cryptoAlgorithm": "RS256",
          "bitSize": 2048,
          "expireInYears": 20,
          "certificate": {{ index $c "casdoor-jwt-cert" | toJson }},
          "privateKey": {{ index $c "casdoor-jwt-key" | toJson }}
        }
      ],
      "applications": [
        {
          "owner": "admin",
          "name": {{ .Values.casdoor.akpApplication.name | quote }},
          "displayName": "AKP",
          "category": "Default",
          "type": "All",
          "organization": {{ $org | quote }},
          "cert": "cert-kubepatch",
          "clientId": {{ .Values.casdoor.akpApplication.clientId | quote }},
          "clientSecret": {{ index $c "akp-casdoor-client-secret" | quote }},
          "enablePassword": true,
          "enableSignUp": false,
          "providers": [],
          "signinMethods": [{"name": "Password", "displayName": "Password", "rule": "All"}],
          "signupItems": [],
          "signinItems": [],
          "grantTypes": ["authorization_code", "refresh_token"],
          "scopes": [],
          "redirectUris": [{{ printf "%s/iam/casdoor/callback" $public | quote }}],
          "tags": [],
          "tokenFields": [],
          "expireInHours": 1,
          "refreshExpireInHours": 1,
          "cookieExpireInHours": 24,
          "tokenFormat": "JWT",
          "tokenSigningMethod": "RS256"
        },
        {
          "owner": "admin",
          "name": {{ .Values.casdoor.patchApplication.name | quote }},
          "displayName": "Patch Console",
          "category": "Default",
          "type": "All",
          "organization": {{ $org | quote }},
          "cert": "cert-kubepatch",
          "clientId": {{ .Values.casdoor.patchApplication.clientId | quote }},
          "clientSecret": {{ index $c "patch-casdoor-client-secret" | quote }},
          "enablePassword": true,
          "enableSignUp": false,
          "providers": [],
          "signinMethods": [{"name": "Password", "displayName": "Password", "rule": "All"}],
          "signupItems": [],
          "signinItems": [],
          "grantTypes": ["authorization_code", "refresh_token"],
          "scopes": [],
          "redirectUris": [{{ printf "%s/patch/api/iam/casdoor/callback" $public | quote }}],
          "tags": [],
          "tokenFields": [],
          "expireInHours": 1,
          "refreshExpireInHours": 1,
          "cookieExpireInHours": 24,
          "tokenFormat": "JWT",
          "tokenSigningMethod": "RS256"
        }
      ],
      "users": [
        {
          "owner": {{ $org | quote }},
          "name": {{ .Values.casdoor.admin.username | quote }},
          "type": "normal-user",
          "password": {{ index $c "admin-password" | quote }},
          "displayName": {{ .Values.casdoor.admin.displayName | quote }},
          "email": {{ .Values.casdoor.admin.email | quote }},
          "countryCode": "US",
          "address": [],
          "tag": "staff",
          "score": 0,
          "isAdmin": true,
          "isForbidden": false,
          "isDeleted": false,
          "signupApplication": {{ .Values.casdoor.akpApplication.name | quote }},
          "properties": {}
        }
      ]
    }
{{- end }}
{{- if eq .Values.tls.mode "selfSigned" }}
{{- $tlsName := include "kubepatch.tlsSecret" . }}
{{- $tls := lookup "v1" "Secret" $ns $tlsName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsName }}
  namespace: {{ $ns }}
  labels:
    {{- include "kubepatch.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
{{- if $tls }}
  tls.crt: {{ index $tls.data "tls.crt" }}
  tls.key: {{ index $tls.data "tls.key" }}
{{- else }}
{{- $g := genSelfSignedCert $host nil (list $host (include "kubepatch.casdoorHost" .)) (int .Values.tls.validityDays) }}
  tls.crt: {{ $g.Cert | b64enc }}
  tls.key: {{ $g.Key | b64enc }}
{{- end }}
{{- end }}
