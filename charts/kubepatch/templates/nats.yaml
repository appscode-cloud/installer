{{- if .Values.nats.enabled }}
{{- $fn := include "kubepatch.fullname" . }}
{{- $ns := .Release.Namespace }}
{{- $credsName := printf "%s-nats-creds" $fn }}
{{- $serverName := printf "%s-nats-server" $fn }}
{{- /*
  NATS runs in operator mode: b3 keeps an account per person and the admin connection it opens at start needs
  an operator, a system account and an admin account. nsc makes them once, in a hook Job that writes two Secrets
  through the API (the seeds never touch the chart, the values or the logs). Those Secrets are not Helm's, so they
  stay on uninstall: hack/kubepatch/teardown.sh removes them.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fn }}-nats-keys
  namespace: {{ $ns }}
  labels:
    {{- include "kubepatch.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fn }}-nats-keys
  namespace: {{ $ns }}
  labels:
    {{- include "kubepatch.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [{{ $credsName | quote }}, {{ $serverName | quote }}]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fn }}-nats-keys
  namespace: {{ $ns }}
  labels:
    {{- include "kubepatch.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fn }}-nats-keys
subjects:
- kind: ServiceAccount
  name: {{ $fn }}-nats-keys
  namespace: {{ $ns }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fn }}-nats-keys
  namespace: {{ $ns }}
  labels:
    {{- include "kubepatch.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "kubepatch.selector" (dict "root" . "component" "nats-keys") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ $fn }}-nats-keys
      {{- include "kubepatch.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nsc
        image: {{ include "kubepatch.image" (dict "root" . "image" .Values.nats.natsBox) }}
        imagePullPolicy: {{ .Values.nats.natsBox.pullPolicy }}
        command: ["sh", "-c"]
        args:
        - |
          set -eu
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          API=https://kubernetes.default.svc/api/v1/namespaces/$NS/secrets
          k() { curl -sS --cacert $SA/ca.crt -H "Authorization: Bearer $(cat $SA/token)" "$@"; }
          if [ "$(k -o /dev/null -w '%{http_code}' $API/$CREDS)" = 200 ]; then echo "the NATS identities exist: nothing to do"; exit 0; fi

          export HOME=/tmp NSC_HOME=/tmp/nsc NKEYS_PATH=/tmp/nkeys XDG_CONFIG_HOME=/tmp/cfg XDG_DATA_HOME=/tmp/data
          nsc add operator --name kubepatch --sys >/dev/null
          nsc add account --name ADMIN >/dev/null
          nsc edit account --name ADMIN --js-mem-storage -1 --js-disk-storage -1 --js-streams -1 --js-consumer -1 >/dev/null
          nsc add user --name admin --account ADMIN >/dev/null

          seed() { find /tmp/nkeys/keys/$1 -name "$2.nk" | head -n 1 | xargs cat; }
          # The .creds layout b3 reads (the JWT and the seed of the key that signs), for an operator, an account or a user.
          creds() { # kind(OPERATOR|ACCOUNT|USER) jwt seed
            printf -- '-----BEGIN NATS %s JWT-----\n%s\n------END NATS %s JWT------\n\n' "$1" "$2" "$1"
            printf -- '************************* IMPORTANT *************************\nNKEY Seed printed below can be used to sign and prove identity.\nNKEYs are sensitive and should be treated as secrets.\n\n'
            printf -- '-----BEGIN %s NKEY SEED-----\n%s\n------END %s NKEY SEED------\n\n*************************************************************\n' "$1" "$3" "$1"
          }
          OP_JWT=$(nsc describe operator --raw)
          OP_PUB=$(nsc describe operator --field sub | tr -d '"')
          SYS_JWT=$(nsc describe account SYS --raw)
          SYS_PUB=$(nsc describe account SYS --field sub | tr -d '"')
          ADMIN_JWT=$(nsc describe account ADMIN --raw)
          ADMIN_PUB=$(nsc describe account ADMIN --field sub | tr -d '"')
          USER_PUB=$(nsc describe user admin --account ADMIN --field sub | tr -d '"')
          SYSUSER_PUB=$(nsc describe user sys --account SYS --field sub | tr -d '"')
          USER_JWT=$(nsc describe user admin --account ADMIN --raw)
          SYSUSER_JWT=$(nsc describe user sys --account SYS --raw)
          mkdir -p /tmp/out
          creds OPERATOR "$OP_JWT" "$(seed O $OP_PUB)" > /tmp/out/Operator.creds
          creds ACCOUNT "$SYS_JWT" "$(seed A $SYS_PUB)" > /tmp/out/SYS.creds
          creds USER "$SYSUSER_JWT" "$(seed U $SYSUSER_PUB)" > /tmp/out/sys.creds
          creds ACCOUNT "$ADMIN_JWT" "$(seed A $ADMIN_PUB)" > /tmp/out/ADMIN.creds
          creds USER "$USER_JWT" "$(seed U $USER_PUB)" > /tmp/out/admin.creds
          printf %s "$OP_JWT" > /tmp/out/Operator.jwt
          printf %s "$SYS_JWT" > /tmp/out/SYS.jwt
          cat > /tmp/out/nats.conf <<CONF
          port: 4222
          http: 8222
          server_name: $SERVER_NAME
          jetstream {
            store_dir: /data/jetstream
          }
          websocket {
            port: 8080
            # TLS ends at the gateway.
            no_tls: true
          }
          operator: /etc/nats/Operator.jwt
          system_account: $SYS_PUB
          resolver {
            type: full
            dir: /data/resolver
            allow_delete: true
            interval: "2m"
          }
          resolver_preload: {
            $SYS_PUB: $SYS_JWT
          }
          CONF
          b64() { base64 -w0 "$1"; }
          post() { # name file...
            name=$1; shift
            data=""
            for f in "$@"; do data="$data\"$(basename $f)\":\"$(b64 $f)\","; done
            printf '{"apiVersion":"v1","kind":"Secret","metadata":{"name":"%s","labels":{"app.kubernetes.io/part-of":"kubepatch"}},"data":{%s}}' "$name" "${data%,}" |
              k -f -o /dev/null -w '%{http_code}\n' -X POST -H 'Content-Type: application/json' -d @- $API
          }
          # The server's Secret goes second: its presence is what a second run finds, after the credentials are in.
          code=$(post $CREDS /tmp/out/Operator.creds /tmp/out/SYS.creds /tmp/out/sys.creds /tmp/out/ADMIN.creds /tmp/out/admin.creds /tmp/out/Operator.jwt /tmp/out/SYS.jwt)
          [ "$code" = 201 ] || { echo "creating $CREDS: HTTP $code"; exit 1; }
          code=$(post $SERVER /tmp/out/nats.conf /tmp/out/Operator.jwt)
          [ "$code" = 201 ] || { echo "creating $SERVER: HTTP $code"; exit 1; }
          echo "NATS identities made"
        env:
        - { name: NS, value: {{ $ns | quote }} }
        - { name: CREDS, value: {{ $credsName | quote }} }
        - { name: SERVER, value: {{ $serverName | quote }} }
        - { name: SERVER_NAME, value: {{ printf "%s-nats" $fn | quote }} }
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - { name: tmp, mountPath: /tmp }
      volumes:
      - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fn }}-nats
  namespace: {{ $ns }}
  labels:
    {{- include "kubepatch.labels" . | nindent 4 }}
spec:
  ports:
  - { name: client, port: 4222, targetPort: client }
  - { name: monitor, port: 8222, targetPort: monitor }
  # The browser connects here through the gateway's /nats route.
  - { name: websocket, port: 8080, targetPort: websocket }
  selector:
    {{- include "kubepatch.selector" (dict "root" . "component" "nats") | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $fn }}-nats
  namespace: {{ $ns }}
  labels:
    {{- include "kubepatch.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $fn }}-nats
  selector:
    matchLabels:
      {{- include "kubepatch.selector" (dict "root" . "component" "nats") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubepatch.selector" (dict "root" . "component" "nats") | nindent 8 }}
    spec:
      {{- include "kubepatch.imagePullSecrets" . | nindent 6 }}
      securityContext:
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nats
        image: {{ include "kubepatch.image" (dict "root" . "image" .Values.nats.image) }}
        imagePullPolicy: {{ .Values.nats.image.pullPolicy }}
        args: ["-c", "/etc/nats/nats.conf"]
        securityContext:
          allowPrivilegeEscalation: false
          # The nats-server binary carries a file capability; with every capability dropped it cannot exec.
          capabilities:
            drop: ["ALL"]
            add: ["NET_BIND_SERVICE"]
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65534
        ports:
        - { name: client, containerPort: 4222 }
        - { name: monitor, containerPort: 8222 }
        - { name: websocket, containerPort: 8080 }
        readinessProbe:
          httpGet: { path: /healthz, port: monitor }
        livenessProbe:
          httpGet: { path: /healthz, port: monitor }
          initialDelaySeconds: 10
        resources:
          {{- toYaml .Values.nats.resources | nindent 10 }}
        volumeMounts:
        - { name: config, mountPath: /etc/nats, readOnly: true }
        - { name: data, mountPath: /data }
      volumes:
      - name: config
        secret:
          secretName: {{ $serverName }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      {{- with .Values.persistence.storageClassName }}
      storageClassName: {{ . }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.persistence.nats }}
{{- end }}
