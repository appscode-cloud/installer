apiVersion: v2
name: kubepatch
description: Kubepatch, the patch console and AKP v2 (identity mode v2_only) with Casdoor, behind one host
type: application
version: v2026.11.15
appVersion: v2026.11.15
home: https://github.com/appscode-cloud
icon: https://cdn.appscode.com/images/products/bytebuilders/icons/android-icon-192x192.png
sources:
- https://github.com/appscode-cloud
maintainers:
- name: appscode
