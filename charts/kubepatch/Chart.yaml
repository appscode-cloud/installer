- name: patch-console-ui
  repository: file://../patch-console-ui
  condition: patch-console-ui.enabled
  version: v2026.11.15
- name: platform-ui
  repository: file://../platform-ui
  condition: platform-ui.enabled
  version: v2026.11.15
- name: cluster-ui
  repository: file://../cluster-ui
  condition: cluster-ui.enabled
  version: v2026.11.15
