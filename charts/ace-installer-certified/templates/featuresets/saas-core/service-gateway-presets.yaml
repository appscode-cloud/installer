{{- with (index .Values "helm" "releases" "service-gateway-presets") }}
{{- if .enabled }}

{{ $defaults := dict }}

{{ $vals := dig "values" dict . }}
{{ $vals = mergeOverwrite $defaults $vals }}
{{ $vals = mergeOverwrite $vals (dict "clusterMetadata" (dict "name" "ace")) }}

{{- /* Gateway API / Envoy CRDs pre-installed by the platform vendor (VMware, Nutanix NKP, ...)
       must not be overwritten by crd-manager. A CRD is ours if crd-manager (voyager or akp)
       wrote it, or the ace-installer managed gateway-api release installed it. */}}
{{- if not (hasKey (dig "gateway" "crd-manager" dict $vals) "updateExistingCRDs") }}
{{-   $vendorManaged := false }}
{{-   range $name := list "gatewayclasses.gateway.networking.k8s.io" "envoyproxies.gateway.envoyproxy.io" }}
{{-     with (lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" $name) }}
{{-       $labels := .metadata.labels | default dict }}
{{-       $ours := and (eq (get $labels "helm.toolkit.fluxcd.io/name") "gateway-api") (eq (get $labels "helm.toolkit.fluxcd.io/namespace") $.Release.Namespace) }}
{{-       range (.metadata.managedFields | default list) }}
{{-         if eq .manager "crd-manager" }}{{ $ours = true }}{{ end }}
{{-       end }}
{{-       if not $ours }}{{ $vendorManaged = true }}{{ end }}
{{-     end }}
{{-   end }}
{{-   if $vendorManaged }}
{{-     $gw := get $vals "gateway" | default dict }}
{{-     $cm := get $gw "crd-manager" | default dict }}
{{-     $_ := set $cm "updateExistingCRDs" false }}
{{-     $_ = set $gw "crd-manager" $cm }}
{{-     $_ = set $vals "gateway" $gw }}
{{-   end }}
{{- end }}

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: service-gateway-presets
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/component: service-gateway-presets
    app.kubernetes.io/part-of: saas-core
spec:
  interval: 5m
  timeout: 30m
  releaseName: service-gateway-presets
  targetNamespace: ace
  storageNamespace: ace
  install:
    createNamespace: {{ $.Values.helm.createNamespace }}
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    remediation:
      retries: -1
  dependsOn:
  - name: catalog-manager
    namespace: {{ $.Release.Namespace }}
  {{- if (dig "cert-manager" "enabled" false $.Values.helm.releases) }}
  - name: cert-manager
    namespace: {{ $.Release.Namespace }}
  {{- end }}
  chart:
    spec:
      chart: service-gateway-presets
      version: {{ .version | quote }}
      interval: 60m
      sourceRef:
        kind: HelmRepository
        name: appscode-charts-oci
        namespace: {{ $.Release.Namespace }}

{{- with $vals }}
  {{- dict "values" . | toYaml | nindent 2 }}
{{- end }}

{{- end }}
{{- end }}
