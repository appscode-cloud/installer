# ProductLine KubePatch: the patch console and AKP v2 (v2_only), with platform-ui and cluster-ui. Casdoor signs people
# in (hosted pages); it, Postgres and the Secrets named below are made outside this chart.
#   helm install ace charts/ace -f charts/ace/profiles/kubepatch.yaml --set global.platform.host=<host> ...
ProductLine: KubePatch
# Off by default in the AKP line only: these are on in values.yaml.
cadence:
  enabled: false
postgres-alerts:
  enabled: false
redis-alerts:
  enabled: false
platform-ui:
  enabled: true
cluster-ui:
  enabled: true
platform-api:
  enabled: true
patch-console-api:
  enabled: true
  casdoor:
    organization: kubepatch
  database:
    # A Secret with the key `url`: postgres://user:pass@host:5432/db?sslmode=... (Postgres 18+)
    secretName: patch-console-database
patch-console-ui:
  enabled: true
global:
  # The patch console's Secrets: keys patch-iam-root-key and patch-casdoor-client-secret.
  credentials:
    secretName: ace-credentials
settings:
  iam:
    casdoor:
      endpoint: http://casdoor.casdoor.svc:8000
      organization: kubepatch
      clientSecret: CHANGE-ME
