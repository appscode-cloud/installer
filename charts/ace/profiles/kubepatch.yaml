# ProductLine KubePatch: the patch console, without b3 web. Casdoor (a sub-chart) signs people in on its hosted pages;
# the hub uses b3's database on this chart's Postgres. The credentials Secret named below is made outside this chart.
#   helm install ace charts/ace -f charts/ace/profiles/kubepatch.yaml --set global.platform.host=<host> ...
ProductLine: KubePatch
# Off by default in the AKP line only: these are on in values.yaml.
cadence:
  enabled: false
postgres-alerts:
  enabled: false
redis-alerts:
  enabled: false
gateway:
  enabled: true
# Casdoor runs on this chart's Postgres; the installer sets its passwords and applications.
casdoor:
  enabled: true
  database:
    host: ace-pgpool.ace.svc
    port: 9999
    password: CHANGE-ME
  adminPassword: CHANGE-ME
  organization:
    name: kubepatch
patch-console-api:
  enabled: true
  casdoor:
    organization: kubepatch
patch-console-ui:
  enabled: true
global:
  # The patch console's Secrets: keys patch-iam-root-key and patch-casdoor-client-secret.
  credentials:
    secretName: ace-credentials
