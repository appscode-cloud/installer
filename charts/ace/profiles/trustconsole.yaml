# ProductLine TrustConsole: the Trust Console, without b3 web. The hub's OpenFGA is ace's, its Valkey is ace's Redis (same
# protocol). Casdoor (a sub-chart) signs people in; the credentials Secret named below is made outside this chart.
#   helm install ace charts/ace -f charts/ace/profiles/trustconsole.yaml --set global.platform.host=<host> ...
ProductLine: TrustConsole
# Off by default in the AKP line only: these are on in values.yaml.
cadence:
  enabled: false
postgres-alerts:
  enabled: false
redis-alerts:
  enabled: false
gateway:
  enabled: true
# Casdoor runs on this chart's Postgres; the installer sets its passwords and applications.
casdoor:
  enabled: true
  database:
    host: ace-pgpool.ace.svc
    port: 9999
    password: CHANGE-ME
  adminPassword: CHANGE-ME
  organization:
    name: trustconsole
openfga:
  enabled: true
trust-console-api:
  enabled: true
  casdoor:
    organization: trustconsole
  # ace's Redis Service, release `ace` in namespace `ace`.
  valkey:
    addr: ace-cache.ace.svc:6379
  openfga:
    apiUrl: http://ace-openfga.ace.svc:8080
trust-console-ui:
  enabled: true
global:
  # The Trust Console's Secrets: keys trust-casdoor-client-secret and trust-iam-csrf-key.
  credentials:
    secretName: ace-credentials
