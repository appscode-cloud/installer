{{- /*
  The cadence chart reads the database password (POSTGRES_PWD) from the
  <cadence fullname>-<service>-secrets, which it normally creates from
  cadence.config.persistence.database.sql.password. It cannot read
  settings.db.auth.password, so:

    1. "cadence.databaseSecrets" is overridden in _helpers.tpl, so the cadence
       chart does not create those secrets.
    2. They are created here from settings.db.auth.password. The schema job and
       the wait-for-schema init containers read POSTGRES_PWD from them.
    3. The cadence server containers read POSTGRES_PWD from ace-cadence-db,
       through cadence.global.env in values.yaml. Its name is fixed because
       values.yaml cannot be templated.
*/ -}}
{{- if .Values.cadence.enabled }}
{{- $cadenceFullname := include "ace.cadenceFullname" . }}
{{- range $svc := list "frontend" "history" "matching" "worker" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $cadenceFullname }}-{{ $svc }}-secrets
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ace.offshootLabels" $ | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PWD: {{ $.Values.settings.db.auth.password | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: ace-cadence-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ace.offshootLabels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PWD: {{ .Values.settings.db.auth.password | quote }}
{{- end }}
