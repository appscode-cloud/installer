{{ if (index .Values "gateway" "enabled") }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "ace.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ace.labels" . | nindent 4 }}
spec:
  gatewayClassName: ace
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    {{- include "ace.gateway.tls" . | nindent 4 }}
    allowedRoutes:
      namespaces:
        from: Same
{{- /* An IP has no subdomains: Casdoor and the Trust Console, which need a host of their own, get a port each. */}}
{{- if eq .Values.global.platform.hostType "ip" }}
{{- range $l := list (dict "name" "casdoor" "port" (include "ace.casdoorPort" $) "on" $.Values.casdoor.enabled) (dict "name" "trust-console" "port" (include "ace.trustConsolePort" $) "on" (index $.Values "trust-console-api" "enabled")) }}
{{- if $l.on }}
  - name: {{ $l.name }}
    protocol: HTTPS
    port: {{ $l.port }}
    {{- include "ace.gateway.tls" $ | nindent 4 }}
    allowedRoutes:
      namespaces:
        from: Same
{{- end }}
{{- end }}
{{- end }}
{{- /* Without TCPRoute (e.g. OpenShift), NATS and s3proxy use their own LoadBalancer Services. */}}
{{- if include "gatewayAPI.tcpRouteVersion" . }}
  - allowedRoutes:
      namespaces:
        from: Same
      kinds:
        - group: gateway.networking.k8s.io
          kind: TCPRoute
    name: nats-tcp
    port: 4222
    protocol: TCP
  - allowedRoutes:
      namespaces:
        from: Same
      kinds:
        - group: gateway.networking.k8s.io
          kind: TCPRoute
    name: s3proxy-tcp
    port: 4224
    protocol: TCP
{{- end }}
{{- end }}
