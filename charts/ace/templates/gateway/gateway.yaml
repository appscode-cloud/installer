{{ if (index .Values "gateway" "enabled") }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "ace.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ace.labels" . | nindent 4 }}
spec:
  gatewayClassName: ace
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: {{ include "ace.fullname" . }}-gw-cert
        namespace: {{ .Release.Namespace }}
{{- $gwCert := lookup "v1" "Secret" .Release.Namespace (printf "%s-gw-cert" (include "ace.fullname" .)) }}
{{- $legacyCert := lookup "v1" "Secret" .Release.Namespace (printf "%s-ingress-cert" (include "ace.fullname" .)) }}
{{- /* The legacy cert is a non-renewing snapshot; serving it next to gw-cert breaks Envoy once it expires. */}}
{{- if and $legacyCert (not $gwCert) }}
      - group: ""
        kind: Secret
        name: {{ include "ace.fullname" . }}-ingress-cert
        namespace: {{ .Release.Namespace }}
{{- end }}
    allowedRoutes:
      namespaces:
        from: Same
{{- /* OpenShift Degrades the ingress operator on unmanaged Gateway API CRDs (TCPRoute), so NATS and s3proxy use their own LoadBalancer Services there. */}}
{{- if ne (include "distro.openshift" .) "true" }}
  - allowedRoutes:
      namespaces:
        from: Same
      kinds:
        - group: gateway.networking.k8s.io
          kind: TCPRoute
    name: nats-tcp
    port: 4222
    protocol: TCP
  - allowedRoutes:
      namespaces:
        from: Same
      kinds:
        - group: gateway.networking.k8s.io
          kind: TCPRoute
    name: s3proxy-tcp
    port: 4224
    protocol: TCP
{{- end }}
{{- end }}
