{{- if and (index .Values "gateway" "enabled") (index .Values "trust-console-api" "enabled") }}
{{- $port := index .Values "trust-console-api" "service" "port" | default 8080 }}
# The Trust Console has a host of its own: the hub's API prefix /api is AKP's too.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ace.fullname" . }}-trust-console
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ace.labels" . | nindent 4 }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "ace.fullname" . }}
    namespace: {{ .Release.Namespace }}
    sectionName: https
  hostnames:
  - {{ include "ace.trustConsoleHost" . }}
  rules:
  - matches:
    - path:
        type: Exact
        value: /
    filters:
    - type: RequestRedirect
      requestRedirect:
        path:
          type: ReplaceFullPath
          replaceFullPath: /trust/
        statusCode: 302
  - name: streaming
    matches:
    - path:
        type: Exact
        value: /api/trustconsole.v1.PostureService/WatchPosture
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /trustconsole.v1.PostureService/WatchPosture
    backendRefs:
    - group: ""
      kind: Service
      name: {{ .Release.Name }}-trust-console-api
      namespace: {{ .Release.Namespace }}
      port: {{ $port }}
  - name: unary
    matches:
    - path:
        type: PathPrefix
        value: /api
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplacePrefixMatch
          replacePrefixMatch: /
    backendRefs:
    - group: ""
      kind: Service
      name: {{ .Release.Name }}-trust-console-api
      namespace: {{ .Release.Namespace }}
      port: {{ $port }}
  - matches:
    - path:
        type: PathPrefix
        value: /trust
    backendRefs:
    - group: ""
      kind: Service
      name: {{ .Release.Name }}-trust-console-ui
      namespace: {{ .Release.Namespace }}
      port: 80
---
# WatchPosture is a stream: no request timeout, an hour of idle.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "ace.fullname" . }}-trust-console-streaming
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: {{ include "ace.fullname" . }}-trust-console
    sectionName: streaming
  timeout:
    http:
      requestTimeout: 0s
      streamIdleTimeout: 1h
{{- end }}
