{{- if and (index .Values "gateway" "enabled") .Values.casdoor.enabled }}
# Casdoor cannot be served under a path: it has a host of its own (a port of its own on an IP).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ace.fullname" . }}-casdoor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ace.labels" . | nindent 4 }}
spec:
  {{- include "ace.gateway.ownHost" (dict "root" . "listener" "casdoor" "host" (include "ace.casdoorHost" .)) | nindent 2 }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: {{ .Release.Name }}-casdoor
      namespace: {{ .Release.Namespace }}
      port: 8000
      weight: 1
{{- end }}
