{{- if and (index .Values "gateway" "enabled") .Values.casdoor.enabled }}
# Casdoor cannot be served under a path: it has a host of its own.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ace.fullname" . }}-casdoor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ace.labels" . | nindent 4 }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "ace.fullname" . }}
    namespace: {{ .Release.Namespace }}
    sectionName: https
  hostnames:
  - {{ include "ace.casdoorHost" . }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: {{ .Release.Name }}-casdoor
      namespace: {{ .Release.Namespace }}
      port: 8000
      weight: 1
{{- end }}
