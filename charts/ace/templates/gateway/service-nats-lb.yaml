{{- if and (index .Values "gateway" "enabled") .Values.nats.enabled (not .Values.nats.nats.externalAccess) (eq (include "distro.openshift" .) "true") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ace.fullname" . }}-nats-lb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ace.labels" . | nindent 4 }}
  {{- with .Values.gateway.loadBalancer.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: LoadBalancer
  {{- with .Values.gateway.loadBalancer.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  ports:
  - name: client
    port: 4222
    targetPort: 4222
    protocol: TCP
  selector:
    app.kubernetes.io/name: {{ default "nats" .Values.nats.nameOverride }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
