{{- $dbUser := ternary .Values.securityContext.runAsUser 70 (eq (include "distro.openshift" $) "true") }}
{{- $resizePolicy := list (dict "resourceName" "cpu" "restartPolicy" "NotRequired") (dict "resourceName" "memory" "restartPolicy" "NotRequired") }}
apiVersion: kubedb.com/v1
kind: Postgres
metadata:
  name: {{ include "ace.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    archiver: "true"
    {{- include "ace.labels" . | nindent 4 }}
spec:
  version: "{{ .Values.settings.db.version }}"
  replicas: 3
  storageType: Durable
  {{- if .Values.pgoutbox.enabled }}
  # Required for PostgreSQL 17's failover logical replication slot sync
  replication:
    walLimitPolicy: ReplicationSlot
    maxSlotWALKeepSize: -1
  {{- end }}
  storage:
    storageClassName: {{ .Values.global.infra.storageClass.name }}
    accessModes:
    - ReadWriteOnce
    resources:
      requests:
        storage: {{ .Values.settings.db.persistence.size }}
  podTemplate:
    spec:
      containers:
      - name: postgres
        resizePolicy:
          {{- toYaml $resizePolicy | nindent 8 }}
        resources:
          {{- toYaml .Values.settings.db.resources | nindent 10 }}
        securityContext:
          runAsGroup: {{ $dbUser }}
          runAsUser: {{ $dbUser }}
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      - name: pg-coordinator
        resizePolicy:
          {{- toYaml $resizePolicy | nindent 8 }}
        resources:
          limits:
            memory: 256Mi
          requests:
            cpu: 200m
            memory: 256Mi
        securityContext:
          runAsGroup: {{ $dbUser }}
          runAsUser: {{ $dbUser }}
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      initContainers:
      - name: postgres-init-container
        securityContext:
          runAsGroup: {{ $dbUser }}
          runAsUser: {{ $dbUser }}
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      securityContext:
        fsGroup: {{ $dbUser }}
        runAsUser: {{ $dbUser }}
        runAsGroup: {{ $dbUser }}
  deletionPolicy: {{ .Values.settings.db.deletionPolicy }}
  authSecret:
    name: {{ include "ace.fullname" . }}-db-auth
    externallyManaged: true
  configuration:
    secretName: {{ include "ace.fullname" . }}-db-config
  init:
    waitForInitialRestore: false
    script:
      secret:
        secretName: {{ include "ace.fullname" . }}-db-init-script
{{- if .Values.global.monitoring }}
  monitor:
    agent: {{ .Values.global.monitoring.agent }}
    prometheus:
      exporter:
      {{- with .Values.global.monitoring.exporter.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
      {{- end }}
      {{- if eq (include "distro.openshift" $) "true" }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsGroup: {{ .Values.securityContext.runAsUser }}
          runAsNonRoot: true
          runAsUser: {{ .Values.securityContext.runAsUser }}
          seccompProfile:
            type: RuntimeDefault
      {{- end }}
      serviceMonitor:
        interval: 30s
        labels:
          {{- toYaml .Values.global.monitoring.serviceMonitor.labels | nindent 10 }}
{{- end }}
