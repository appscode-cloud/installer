apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "patch-console-ui.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "patch-console-ui.labels" . | nindent 4 }}
data:
  config.js: |
    window.__PATCH_CONSOLE__ = {{ toJson (dict "clusterUiBaseUrl" (ternary (default (printf "%s/console" (include "patch-console-ui.baseUrl" .)) .Values.clusterUi.baseUrl) "" .Values.clusterUi.enabled) "clusterUiCveReportPath" .Values.clusterUi.cveReportPath) }}
