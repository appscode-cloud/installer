# Default values for patch-console-ui.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# The patch console's UI: nginx serving /patch and proxying /patch/api to the hub (patch-console-api).

replicaCount: 1

# Docker registry fqdn used to pull app related images.
registryFQDN: ghcr.io

image:
  # Docker registry used to pull app container image
  registry: appscode
  repository: patch-console-ui
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  # A digest ("sha256:...") wins over the tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext: # +doc-gen:break
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# The hub the UI's nginx proxies /patch/api to.
hub:
  # Service name. Empty: `<release>-patch-console-api`.
  service: ""
  port: 8080

# Links to a cluster's CVE report in cluster-ui.
clusterUi:
  enabled: true
  # Where cluster-ui is served. Empty: `https://<global.platform.host>/console`.
  baseUrl: ""
  cveReportPath: /clusters/{cluster}/security/cve-report
