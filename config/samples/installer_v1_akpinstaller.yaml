apiVersion: installer.akp.appscode.com/v1
kind: AkpInstaller
metadata:
  name: akpinstaller-sample
spec:
  # Default values copied from <project_dir>/helm-charts/akp-installer/values.yaml
  fullnameOverride: ""
  helm:
    createNamespace: true
    releases:
      ace:
        enabled: false
        version: v2026.10.30
      acerproxy:
        enabled: false
        version: v2026.10.30
      aceshifter:
        enabled: true
        version: v2026.10.30
      akp-crd-manager:
        enabled: true
        version: v2026.10.30
      argo-cd:
        enabled: false
        version: 10.11.6
      capi-catalog:
        enabled: false
        version: v2024.10.24
      catalog-manager:
        enabled: false
        version: v2026.10.30
      cert-manager:
        enabled: true
        version: v1.19.3
      cert-manager-csi-driver-cacerts:
        enabled: true
        version: v2026.9.18
      cluster-manager-spoke:
        enabled: false
        version: v2026.2.16
      external-dns-operator:
        enabled: true
        version: v2026.6.22
      fargocd:
        enabled: false
        version: v2026.9.18
      flux2:
        enabled: false
        version: 2.19.1
      gateway-api:
        enabled: false
        version: v2026.9.18
      gateway-api-crds:
        enabled: true
        version: v1.5.1
      kube-ui-server:
        enabled: true
        version: v2026.10.30
      kubedb:
        enabled: true
        values:
          global:
            featureGates:
              ClickHouse: true
              Pgpool: true
          kubedb-autoscaler:
            enabled: true
          kubedb-catalog:
            enabled: true
          kubedb-kubestash-catalog:
            enabled: true
          kubedb-metrics:
            enabled: false
          kubedb-ops-manager:
            enabled: true
          kubedb-provisioner:
            enabled: true
          kubedb-schema-manager:
            enabled: false
          sidekick:
            enabled: false
        version: v2026.10.12
      kubestash:
        enabled: false
        version: v2026.10.12
      license-proxyserver:
        enabled: true
        version: v2026.9.18
      opscenter-features:
        enabled: true
        version: v2026.10.30
      panopticon:
        enabled: true
        values:
          monitoring:
            agent: prometheus.io/operator
            enabled: true
            serviceMonitor:
              labels:
                release: kube-prometheus-stack
        version: v2026.9.18
      prom-label-proxy:
        enabled: false
        version: v2026.4.30
      reloader:
        enabled: true
        version: 2.2.9
      service-gateway-presets:
        enabled: false
        version: v2026.10.30
      service-vault:
        enabled: false
        version: v2026.10.30
      spoke-cluster-addons:
        enabled: false
        version: v2026.2.16
      stash-presets:
        enabled: false
        version: v2026.10.30
      vcluster:
        enabled: false
        version: 0.22.4
      vcluster-plugin-ace:
        enabled: false
        version: v0.0.3
    repositories:
      appscode-charts-oci:
        url: oci://ghcr.io/appscode-charts
      appscode-wizards-oci:
        url: oci://ghcr.io/appscode-charts
  image:
    proxies:
      appscode: r.appscode.com
      dockerHub: ""
      dockerLibrary: ""
      ghcr: ghcr.io
      kubernetes: registry.k8s.io
      microsoft: mcr.microsoft.com
      oracle: container-registry.oracle.com
      quay: quay.io
      weaviate: cr.weaviate.io
  installerVersion: ""
  nameOverride: ""
  offlineInstaller: false
  options: ""
  precheck:
    affinity: {}
    enabled: true
    image:
      pullPolicy: Always
      registry: appscode
      repository: b3
      tag: ""
    nodeSelector: {}
    podAnnotations: {}
    podSecurityContext: {}
    resources: {}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault
    tolerations: []
  regcache:
    affinity: {}
    enabled: true
    fullnameOverride: ""
    image:
      pullPolicy: IfNotPresent
      registry: appscode-images
      repository: registry
      tag: 3.1.1
    imagePullSecrets: []
    infra:
      storageClass:
        name: ""
    nameOverride: ""
    nodeSelector: {}
    password: ""
    persistence:
      accessMode: ReadWriteOnce
      enabled: true
      size: 10Gi
      storageClass: ""
    podAnnotations: {}
    podSecurityContext:
      fsGroup: 65534
    registryFQDN: ghcr.io
    remoteURL: https://ghcr.io
    replicaCount: 1
    resources: {}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault
    service:
      port: 5000
      type: ClusterIP
    tolerations: []
    ttl: 72h
    username: ""
  registry:
    certs: {}
    credentials: {}
    imagePullSecrets: []
  selfManagement:
    argoCD: {}
    createCAPICluster: false
    disableFeatures: []
    enableCredLess: false
    enableFeatures: []
    import: true
    targetIPs: []
    useGateway: false
  tester:
    affinity: {}
    image:
      pullPolicy: IfNotPresent
      registry: appscode
      repository: kubectl-nonroot
      tag: "1.34"
    nodeSelector: {}
    podAnnotations: {}
    podSecurityContext: {}
    resources: {}
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault
    tolerations: []
