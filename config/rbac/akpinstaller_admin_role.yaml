# This rule is not used by the project akp-installer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over installer.akp.appscode.com.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: akp-installer
    app.kubernetes.io/managed-by: kustomize
  name: akpinstaller-admin-role
rules:
- apiGroups:
  - installer.akp.appscode.com
  resources:
  - akpinstallers
  verbs:
  - '*'
- apiGroups:
  - installer.akp.appscode.com
  resources:
  - akpinstallers/status
  verbs:
  - get
