# This rule is not used by the project akp-installer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to installer.akp.appscode.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: akp-installer
    app.kubernetes.io/managed-by: kustomize
  name: akpinstaller-viewer-role
rules:
- apiGroups:
  - installer.akp.appscode.com
  resources:
  - akpinstallers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - installer.akp.appscode.com
  resources:
  - akpinstallers/status
  verbs:
  - get
