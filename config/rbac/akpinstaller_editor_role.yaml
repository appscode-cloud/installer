# This rule is not used by the project akp-installer itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within installer.akp.appscode.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: akp-installer
    app.kubernetes.io/managed-by: kustomize
  name: akpinstaller-editor-role
rules:
- apiGroups:
  - installer.akp.appscode.com
  resources:
  - akpinstallers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - installer.akp.appscode.com
  resources:
  - akpinstallers/status
  verbs:
  - get
