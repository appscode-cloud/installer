apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
##
## Base operator rules
##
# We need to get namespaces so the operator can read namespaces to ensure they exist
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
# We need to manage Helm release secrets
- apiGroups:
  - ""
  resources:
  - secrets
  - serviceaccounts
  verbs:
  - "*"
# We need to create events on CRs about things happening during reconciliation
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create

##
## Rules for installer.akp.appscode.com/v1, Kind: AkpInstaller
##
- apiGroups:
  - installer.akp.appscode.com
  resources:
  - akpinstallers
  - akpinstallers/status
  - akpinstallers/finalizers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  - services
  - services/finalizers
  - endpoints
  - persistentvolumeclaims
  - events
  - configmaps
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - daemonsets
  - replicasets
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

- apiGroups:
  - batch
  resources:
  - jobs
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  - clusterrolebindings
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups:
  - charts.x-helm.dev
  resources:
  - clusterchartpresets
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups:
  - helm.toolkit.fluxcd.io
  resources:
  - helmreleases
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups:
  - source.toolkit.fluxcd.io
  resources:
  - helmrepositories
  verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs: ["get", "list", "watch"]
- apiGroups:
  - kubedb.com
  resources:
  - postgreses
  verbs: ["get", "list", "watch"]
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs: ["create", "get", "list", "patch", "update", "watch"]

# +kubebuilder:scaffold:rules
